--font-display); text-transform:uppercase; font-weight:600; font-size:24px; margin-top:12px; color:#fff;\">Proteger la opción de compra<\/div>\n      <div style=\"font-family: var(--font-body); font-size:24px; color: rgba(255,255,255,0.72); margin-top:10px; line-height:1.35;\">Si el cliente está en mora y quiere conservar el leasing: sostener que el bien no es adjudicable y pagar aparte lo que estuvo en mora.<\/div>\n    <\/div>\n    <div style=\"background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius: var(--radius-md); padding:26px 22px; display:flex; flex-direction:column;\">\n      <div style=\"font-family: var(--font-display); font-weight:700; font-size:40px; color: var(--atria-gold-300, #D2B181);\">5<\/div>\n      <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size:24px; margin-top:12px; color:#fff;\">Cliente al día<\/div>\n      <div style=\"font-family: var(--font-body); font-size:24px; color: rgba(255,255,255,0.72); margin-top:10px; line-height:1.35;\">Relacionar la deuda en cero, sin incluir el leasing como activo — con base en el Auto 185/2024 de Buga y el Tribunal de Cali.<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer-row\" style=\"position:relative;\">\n    <div style=\"font-family: var(--font-body); font-size: var(--type-micro); color: rgba(255,255,255,0.5);\"><\/div>\n  <\/div>\n<\/section>\n\n<section data-label=\"Cierre QR\" data-screen-label=\"21\" style=\"position:relative; width:100%; height:100%; background: linear-gradient(135deg, var(--atria-navy-950) 0%, var(--atria-navy-500) 100%); color:#fff; overflow:hidden; padding: 76px var(--pad-x) 56px; display:flex; flex-direction:column;\">\n  <img src=\"img-01-textura-decorativa.png\" alt=\"\" style=\"position:absolute; bottom:-160px; right:-140px; width:820px; height:820px; opacity:0.08; pointer-events:none;\">\n  <img src=\"img-16-atria.png\" alt=\"Atria\" style=\"position:absolute; top:40px; right:var(--pad-x); width:170px; height:auto; filter:brightness(0) invert(1); z-index:1;\">\n  <div style=\"position:absolute; top:118px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:rgba(255,255,255,0.75); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div style=\"position:relative; z-index:1;\">\n    <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size:48px; letter-spacing:-0.01em; color:#fff;\">Escanea el código QR<\/div>\n    <div class=\"atria-sub-italic\" style=\"font-size:26px; color: rgba(255,255,255,0.85); margin-top:6px;\">y únete a nuestra comunidad<\/div>\n  <\/div>\n  <div style=\"position:relative; z-index:1; display:flex; align-items:center; justify-content:center; gap:96px; flex:1; margin-top:16px;\">\n    <div style=\"background:#fff; border-radius:28px; width:520px; padding:64px 48px 48px; position:relative; box-shadow: var(--shadow-lg); text-align:center;\">\n      <img src=\"img-17-logo-circular-comunidad-atria.png\" alt=\"\" style=\"position:absolute; top:-38px; left:50%; transform:translateX(-50%); width:76px; height:76px; border-radius:50%; box-shadow: var(--shadow-md); background:#fff;\">\n      <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size:26px; color: var(--atria-ink); line-height:1.25;\">Comunidad académica<br>Atria Abogados<\/div>\n      <div style=\"font-family: var(--font-body); font-size:24px; color: var(--atria-steel-500); margin-top:8px;\">Grupo de WhatsApp<\/div>\n      <img src=\"img-18-codigo-qr-comunidad-atria-abogados.png\" alt=\"Código QR — comunidad Atria Abogados\" style=\"width:100%; max-width:380px; margin-top:28px;\">\n    <\/div>\n    <div style=\"display:flex; flex-direction:column; gap:28px; font-family: var(--font-body); font-size:26px; color:#fff; min-width:420px;\">\n      <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size:22px; letter-spacing:0.1em; color: var(--atria-gold-300, #D2B181); margin-bottom:4px; font-size:24px;\">Síguenos<\/div>\n      <div style=\"position:relative; background:#fff; border-radius: var(--radius-md); padding:20px 24px; box-shadow: var(--shadow-md); margin-bottom:4px;\">\n        <div style=\"position:absolute; bottom:-13px; left:38px; width:0; height:0; border-left:13px solid transparent; border-right:13px solid transparent; border-top:13px solid #fff;\"><\/div>\n        <div style=\"display:flex; align-items:flex-start; gap:16px;\">\n          <div style=\"flex:none; width:44px; height:44px; border-radius:50%; background: var(--atria-gold-300, #D2B181); display:flex; align-items:center; justify-content:center;\">\n            <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--atria-navy-900)\" stroke-width=\"1.8\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"><\/path><\/svg>\n          <\/div>\n          <div>\n            <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size:19px; letter-spacing:0.01em; color: var(--atria-navy-900); line-height:1.2;\">¿Quieres esta presentación?<\/div>\n            <div style=\"font-family: var(--font-body); font-size:18px; color: var(--atria-steel-500); margin-top:5px; line-height:1.35;\">Escríbenos la palabra <strong style=\"color: var(--atria-navy-900);\">\"CONFERENCIA\"<\/strong> por mensaje privado en Instagram o TikTok y te la compartimos.<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div style=\"display:flex; align-items:center; gap:20px; background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius: var(--radius-md); padding:22px 28px;\">\n        <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.6\" style=\"flex:none;\"><rect x=\"2.5\" y=\"2.5\" width=\"19\" height=\"19\" rx=\"5\"><\/rect><circle cx=\"12\" cy=\"12\" r=\"4.2\"><\/circle><circle cx=\"17.2\" cy=\"6.8\" r=\"1.1\" fill=\"#fff\" stroke=\"none\"><\/circle><\/svg>\n        <div><div style=\"font-size:24px; color: rgba(255,255,255,0.6);\">Instagram<\/div><div>@majoinsolvencia<\/div><\/div>\n      <\/div>\n      <div style=\"display:flex; align-items:center; gap:20px; background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius: var(--radius-md); padding:22px 28px;\">\n        <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.6\" style=\"flex:none;\"><path d=\"M16 3c.4 2.2 2 3.9 4 4.2v3.1c-1.5 0-2.9-.4-4-1.2v6.4a5.4 5.4 0 1 1-5.4-5.4c.3 0 .6 0 .9.1v3.2a2.3 2.3 0 1 0 1.6 2.2V3h2.9z\"><\/path><\/svg>\n        <div><div style=\"font-size:24px; color: rgba(255,255,255,0.6);\">TikTok<\/div><div>@majoinsolvencia<\/div><\/div>\n      <\/div>\n      <div style=\"display:flex; align-items:center; gap:20px; background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius: var(--radius-md); padding:22px 28px;\">\n        <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.6\" style=\"flex:none;\"><circle cx=\"12\" cy=\"12\" r=\"9.5\"><\/circle><ellipse cx=\"12\" cy=\"12\" rx=\"4\" ry=\"9.5\"><\/ellipse><line x1=\"2.5\" y1=\"12\" x2=\"21.5\" y2=\"12\"><\/line><\/svg>\n        <div><div style=\"font-size:24px; color: rgba(255,255,255,0.6);\">Sitio web<\/div><div>www.atriaabogados.com<\/div><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n\n\n<\/x-import><\/x-dc>\n\n\n\n\n<\/body><\/html>"</script>
<script>
(function () {
  "use strict";

  var SECTIONS = [{"num": "1", "title": "Introducción", "category": "Introducción", "text": "Quiero empezar con algo que seguramente muchos de los que estamos aquí hemos vivido, porque los que asesoramos deudores en procesos de insolvencia conocemos bien ese primer momento de la entrevista con el cliente. Le preguntamos: \"¿tiene deudas?\" Nos las cuenta. Le preguntamos: \"¿tiene bienes?\" Y la persona nos mira y nos dice: \"no, no tengo nada\". Y ahí, sinceramente, muchos respiramos tranquilos. Pensamos: \"qué bien, esto va a ser un proceso sencillo\". Empezamos a armar mentalmente el caso, casi que ya vemos la audiencia de adjudicación sin mayores complicaciones.\nPero seguimos la entrevista. Y en algún momento, casi de pasada, el cliente agrega: \"ah, y tengo un leasing\".\nY ahí, seamos honestos, a muchos se nos cambia la cara.\n¿Cuántos de nosotros nos hemos sentido perdidos en ese instante? ¿Cuántos hemos tenido que sonreír, decir \"listo, no hay problema\", y por dentro pensar \"¿y ahora esto cómo lo manejo\"? Porque el leasing no se comporta como una deuda cualquiera, ni como un bien cualquiera. No sabemos, en ese momento, si eso hay que declararlo como bien, como deuda, como las dos cosas, si es embargable, si el cliente puede seguirlo pagando, si puede terminarlo, si puede ceder sus derechos, qué pasa si no ejerce la opción de compra, o qué pasa si el proceso llega hasta la adjudicación y ese leasing sigue ahí, sin resolverse.\nEsa incertidumbre, esa sensación de \"me quedé sin piso\" frente a algo que parecía tan simple como una pregunta de rutina, es exactamente el punto de partida de esta conferencia. Porque el leasing financiero, dentro de un proceso de insolvencia de persona natural no comerciante, no es un detalle menor. Es, muchas veces, la pieza que más dudas genera, la que más discusiones ha producido en los despachos judiciales, y la que, si no se entiende bien desde el principio, puede terminar complicando todo el proceso que creíamos que iba a ser sencillo.\nAsí que hoy no vamos a dejar esa pregunta sin respuesta. Vamos a recorrer, paso a paso, qué es el leasing, qué naturaleza tiene ese derecho, cómo se declara, cómo se protege, qué pasa cuando se abre la liquidación, y qué ocurre al final, en la adjudicación. Para que la próxima vez que un cliente les diga \"ah, y tengo un leasing\", ninguno de ustedes vuelva a sentirse perdido.", "slideIndex": 2, "type": "conference", "sourceLabel": null, "sourceUrl": null}, {"num": "2.1", "title": "¿Qué es el leasing?", "category": "Fundamentos del leasing", "text": "\"Con todo, el leasing en Colombia se define como un contrato financiero, que se distingue por ser principal, bilateral, consensuado, oneroso, conmutativo, de tracto sucesivo y de naturaleza mercantil, por medio del cual el propietario de un bien de capital cede su uso por un determinado tiempo, a cambio de una renta periódica, pudiendo acordar eventualmente con el usuario del bien, una opción de compra”\nDecreto 2555 de 2010, ARTÍCULO 2.2.1.1.1 Definición de arrendamiento financiero o leasing. Entiéndese por operación de arrendamiento financiero la entrega a título de arrendamiento de bienes adquiridos para el efecto financiando su uso y goce a cambio del pago de cánones que recibirá durante un plazo determinado, pactándose para el arrendatario la facultad de ejercer al final del período una opción de compra.\nEn consecuencia el bien deberá ser de propiedad de la compañía arrendadora derecho de dominio que conservará hasta tanto el arrendatario ejerza la opción de compra. Así mismo debe entenderse que el costo del activo dado en arrendamiento se amortizará durante el término de duración del contrato, generando la respectiva utilidad.", "slideIndex": 3, "type": "conference", "sourceLabel": null, "sourceUrl": null}, {"num": "2.2", "title": "¿Qué es la opción de compra?", "category": "Fundamentos del leasing", "text": "La opción de compra en un contrato de leasing es la facultad contractual concedida al arrendatario (locatario) para adquirir la propiedad del bien objeto del contrato al término (o en determinado momento) del plazo, mediante el pago de un precio pactado (valor residual, precio de opción) y siempre dentro de las condiciones establecidas en el contrato.\nEs un instrumento típico del leasing financiero: el contrato combina financiación con el uso del bien y la opción brinda al arrendatario la posibilidad de quedarse con el activo al final del periodo de arrendamiento.\nAcción potestativa contractual: no es una obligación del arrendador transferir la propiedad, sino una opción otorgada al arrendatario; si el arrendatario ejerce legítimamente la opción, el arrendador está obligado a transferir.\nDerecho condicionado: la transferencia del dominio se perfecciona sólo cuando se cumplen las condiciones pactadas (ejercicio de la opción y pago del precio residual).\nEs la mayor diferenciación del contrato de leasing del contrato de arrendamiento, Francisco González Castillo, manifiesta que: “La opción de compra se paga durante toda la vida del contrato, en la medida en que cada una de las cuotas del contrato incluye una parte de la amortización del precio del bien, (por lo que) es más una facultad o derecho de adquisición” en ese orden de ideas, “la opción de compra no debe identificarse con el llamado valor residual”.", "slideIndex": 4, "type": "conference", "sourceLabel": null, "sourceUrl": null}, {"num": "2.3", "title": "Sobre el derecho de dominio o propiedad", "category": "Fundamentos del leasing", "text": "Decreto 2555 de 2010, ARTÍCULO 2.28.1.3.1 Propiedad del inmueble. El bien inmueble entregado en leasing habitacional deberá ser de propiedad de la entidad autorizada durante el término del contrato, derecho de dominio que se trasferirá cuando el locatario ejerza la opción de adquisición, pague su valor y se cumplan las normas aplicables sobre tradición de la propiedad. Lo anterior, sin perjuicio de que varias entidades autorizadas entreguen en leasing conjuntamente inmuebles de propiedad común mediante la modalidad de leasing habitacional sindicado.\nEn todo caso las entidades autorizadas podrán transferir a sociedades titularizadoras o a sociedades fiduciarias los bienes inmuebles objeto de contratos de leasing habitacional, cuando dicha transferencia tenga por objeto el desarrollo de procesos de titularización de flujos derivados de dichos contratos a partir de universalidades o patrimonios autónomos, respectivamente.\nhttps://semillerocontratos.uniandes.edu.co/el-contrato-de-leasing-financiero-y-la-redefinicion-de-la-nocion-de-patrimonio-y-del-principio-de-universalidad-concursal/#_ftnref9\nEn primer lugar, el Leasing Financiero es un contrato de financiación, que hace las veces de un vehículo contractual con fines de garantía, razón por la que le son aplicables las normas contenidas en la Ley 1676 de 2013. En segundo lugar, derivado de la dimensión objetiva del principio de universalidad contenida en la Ley 1676 de 2013, el bien objeto de Leasing, dentro de un proceso de insolvencia del “Locatario”, tendrá que hacer parte del patrimonio objeto de insolvencia. Lo anterior bajo el entendido de que el derecho que tiene el “Locatario” o “arrendatario financiero” sobre el bien objeto de Leasing, es un “derecho de dominio sujeto a una condición suspensiva”; condición que sería el pago total de las cuotas, así como el ejercicio de la opción de compra.\nhttps://www.supersociedades.gov.co/documents/107391/159040/OFICIO%20220-33566\nEl derecho de dominio sobre bienes objeto del contrato de leasing financiero. Por las consideraciones expuestas, puede afirmarse que hasta tanto se manifieste por los medios idóneos y dentro de la oportunidad debida el asentimiento de ejercer la opción de compra, el locatario no tiene más que una mera expectativa de hacerse dueño de la cosa, y el derecho de dominio radica en cabeza de la compañía de leasing. Pero una vez expresado, se impone para la leasing la obligación de transferirlo por medio de su tradición. Esta operación implica que, cumplida una condición (la manifestación del locatario de querer hacerse dueño), surge la promesa de celebrar un negocio que sólo produce obligaciones de hacer y, en estricta juridicidad, no genera un derecho de dominio. Ahora bien, para que la transferencia del derecho de dominio sea íntegra a la luz de la legislación nacional, se requiere la dualidad título y modo, de donde en tratándose del caso que nos ocupa, el título traslaticio será complejo, pues lo constituye el contrato de leasig financiero y la manifestación del ejercicio de la opción de compra y el modo será la tradición o entrega jurídica del bien. En conclusión, hasta tanto el locatario no cumpla con el pago debido como consecuencia del ejercicio de la opción de compra y se le haga tradición del bien, no puede reputarse titular legítimo del derecho de dominio sobre éste.", "slideIndex": 5, "type": "conference", "sourceLabel": null, "sourceUrl": null}, {"num": "2.4", "title": "Tratamiento contable y tributario del leasing", "category": "Fundamentos del leasing", "text": "Art. 127-1 ET: Leasing financiero: Es aquel cuyo objeto real es la adquisición financiada de un activo. El ET señala cinco indicios que permiten identificarlo: transferencia de propiedad al final, opción de compra a precio inferior al valor comercial, plazo que cubre la mayor parte de la vida útil del bien, valor presente de los cánones equivalente al valor comercial del activo, o bienes tan especializados que solo el locatario puede usarlos. Basta con que se cumpla uno. La DIAN puede evaluar la esencia económica del contrato para reclasificarlo.\n2. Tratamiento fiscal del leasing financiero (arrendador)\nEl arrendador financiero hace esto al momento de celebrar el contrato: reconoce un activo (no el bien físico, sino un activo financiero) equivalente al valor presente de los cánones + opción de compra + valor residual de garantía si aplica. De ahí en adelante, solo declara como ingreso los rendimientos financieros que genera ese activo, más cualquier otro ingreso derivado del contrato. Es decir, trata la operación como lo que económicamente es: un préstamo, no un arriendo.\n3. Tratamiento fiscal del leasing financiero (arrendatario)\nEl ET le exige al arrendatario registrar desde el inicio tanto un activo como un pasivo, ambos por el mismo valor que registró el arrendador. A partir de ahí, cada canon se descompone en dos partes:\nLa parte de abono a capital va directo contra el pasivo, reduciendo la deuda. No es deducible por sí sola.\nLa parte de intereses o costo financiero es un gasto deducible, sujeto a los límites de subcapitalización del ET (art. 118-1).\nEl activo registrado, por su parte, se puede depreciar o amortizar como si el bien fuera propio del arrendatario, con una excepción importante: si el contrato recae sobre un inmueble, la parte del activo que corresponde a terreno no es depreciable ni amortizable, igual que si fuera dueño.\n4. Los dos desenlaces al final del contrato\nSi ejerce la opción de compra: el valor de la opción se carga contra el saldo del pasivo, que debe quedar en cero. Si hay diferencia, se ajusta como ingreso o gasto según corresponda.\nSi no ejerce la opción: se hacen los ajustes en activo y pasivo, y la diferencia que surja no tiene efecto en renta, salvo que previamente se hubieran deducido costos o gastos asociados, caso en el cual esa diferencia se trata como recuperación de deducciones o que implica un ingreso gravable.", "slideIndex": 6, "type": "conference", "sourceLabel": null, "sourceUrl": null}, {"num": "3.1", "title": "¿Existe un derecho del locatario en el contrato de leasing financiero?", "category": "El leasing en la fase de negociación", "text": "ART 539 #4: Una relación completa y detallada de sus bienes, si los hubiere, incluidos los que posea en el exterior. Deberán indicarse los valores estimados y los datos necesarios para su identificación, así como la información detallada de los gravámenes, afectaciones y medidas cautelares que pesen sobre ellos, y deberá indicarse cuáles de ellos tienen afectación a vivienda familiar y cuáles son objeto de patrimonio de familia inembargable.\nARTÍCULO 565. EFECTOS DE LA PROVIDENCIA DE APERTURA. La declaración de apertura de la liquidación patrimonial produce como efectos:\n4. <Numeral modificado por el artículo 31 de la Ley 2445 de 2025. El nuevo texto es el siguiente:> La integración de la masa de los activos del deudor, que se conformará por los bienes y derechos de los cuales este sea titular al momento de la apertura de la liquidación patrimonial y los que se hayan reintegrado a su patrimonio en virtud de acciones revocatorias o de simulación que hubieran prosperado. El auto de apertura dispondrá el embargo y secuestro de dichos bienes, que el juez dejará en depósito gratuito en manos del deudor. Cuando el liquidador sea el mismo deudor no se requerirá diligencia de secuestro para que se perfeccione la medida, pero el deudor allegará al expediente constancia detallada, acompañada de fotos o videos, del estado en que los bienes se encuentren, información que deberá actualizar trimestralmente, so pena de ser removido del cargo de secuestre o perder la calidad de depositario de los bienes, salvo que el deudor demuestre que su incumplimiento se debió a fuerza mayor.\nNo se contarán dentro de la masa de la liquidación los bienes de su cónyuge o compañero permanente, ni aquellos sobre los cuales haya constituido patrimonio de familia inembargable, los que se hubieren afectado a vivienda familiar, así como aquellos que tengan la condición de inembargables. El juez de la liquidación resolverá mediante incidente cualquier solicitud de que se embarguen inmuebles afectados a vivienda familiar o que constituyan patrimonio de familia que haga un acreedor que alegue tener derecho a perseguir dichos bienes.", "slideIndex": 7, "type": "conference", "sourceLabel": null, "sourceUrl": null}, {"num": "3.2", "title": "¿Es embargable el derecho del locatario derivado de un contrato de leasing financiero?", "category": "El leasing en la fase de negociación", "text": "Juzgado Primero Civil del Circuito del Departamento Archipiélago de San Andrés, Providencia y Santa Catalina, radicado 88-001-31-03-001-2021-00046-00.\nhttps://portalhistorico.ramajudicial.gov.co/documents/27471304/133857480/43AutoDecretaMedidasCautelares.+.pdf/3bc4ff5a-da91-4238-a386-2ed4c5bac32e#:~:text=hasta%20tanto%20sea%20aceptada%20por%20la%20entidad%20arrendadora.&text=%C2%AC%20Los%20contratos%20de%20leasing,tambi%C3%A9n%20tiene%20un%20contenido%20patrimonial%20\nTras analizar la naturaleza del leasing habitacional y la opción de compra inherente al contrato (Contrato de Leasing Habitacional No. 211367 entre la ejecutada y Leasing Bancolombia), el Juzgado expone —con fundamento en doctrina y jurisprudencia— que el derecho de opción de compra es un bien incorporal y forma parte del patrimonio del locatario, por lo cual puede integrarse en la prenda general de los acreedores (art. 2488 C.C.) y, en consecuencia, ser objeto de embargo\nEl Juzgado entiende la opción de compra del arrendatario en un contrato de leasing como un derecho personal incorporal (un bien inmaterial susceptible de estimación económica) que integra el patrimonio del deudor/locatario. Por tanto, no se embarga la propiedad del bien (esta pertenece al arrendador hasta que se ejerza la opción), sino el derecho del locatario a adquirir el bien al vencimiento del contrato. (fundamento en el auto, secciones que explican naturaleza del derecho y su inclusión en la universalidad patrimonial).\nEl auto se apoya en la doctrina civil sobre patrimonio como universalidad que incluye bienes incorporales y en las normas que disponen la prenda general de los acreedores (art. 2488 C.C.), y en las facultades del juez ejecutivo para decretar embargos y medidas cautelares (art. 599 y 593 del C.G.P., según cita en el auto). Además, cita jurisprudencia que ha considerado embargable la opción de compra en contratos de leasing habitacional. (ver pasajes referidos en el documento).\nExistencia de un derecho patrimonializable: Para que la opción sea embargable debe tratarse de un derecho con contenido económico y transmisible (el auto resalta que la ley permite la cesión del derecho de opción y que, por tanto, es comercio susceptible de embargo). (43AutoDecretaMedidasCautelares. .pdf, exposición sobre Decreto 1787/2004 y cesión del derecho\nDesde la óptica del Juzgado, la opción de compra en un contrato de leasing habitacional sí puede ser embargada porque constituye un derecho patrimonial incorporal que forma parte del patrimonio del arrendatario y, por tanto, de la prenda general de los acreedores\nTribunal Superior de Buga, Sala Civil Familia, radicado 76-147-31-03-001-2024-00030-01. https://publicacionesprocesales.ramajudicial.gov.co/c/document_library/get_file?uuid=c727911d-3e27-5a6b-a0c8-8002d6b70624&groupId=6098902\nAsunto: Medidas cautelares de embargo y secuestro. El derecho a ejercer la opción de compra derivada de un contrato de leasing financiero es susceptible de las medidas cautelares de embargo y secuestro dentro de un proceso ejecutivo, en tanto, es considerado como un verdadero bien que hace parte del patrimonio del deudor y, por tanto, prenda general de los acreedores.\nAsí las cosas y conforme con la postura de la Sala de Casación Civil puede concluirse que, en línea de principio, el leasing financiero es un contrato traslativo de uso y goce más no traslativo de dominio el que, eventualmente, puede convertirse en título para la adquisición de la propiedad del bien. (…).\nEs importante memorar que el patrimonio es una universalidad jurídica compuesta de bienes activos y pasivos, radicados en una persona jurídica individual o colectiva en cuanto sean susceptibles de estimación económica y puedan ser objeto de operaciones jurídicas. Consiguientemente, hacen parte de él, los derechos reales y personales como también los derechos sobre objetos inmateriales como, por ejemplo, el nombre comercial, la propiedad intelectual, etc. Se insiste, hay bienes que no son susceptibles de captar por los sentidos, sino que pertenecen a una categoría que se encuentra en el campo de los conceptos, estos son los bienes incorporales, inmateriales o intangibles, que integran, se repite, el patrimonio de una persona\nDesde esta perspectiva, y en consideración a los hechos originarios del recurso vertical, es indiscutible que el derecho de opción de compra es un bien incorporal que puede el locatario exigir después de cumplido el leasing a la entidad bancaria; en tanto como derecho personal no hay duda ninguna que hace parte del patrimonio del locatario, y por consiguiente se constituye en prenda general de los acreedores.\nResulta entonces sensato afirmar que el derecho de opción de adquisición sí se encuentra en el comercio, toda vez que el locatario lo puede ceder onerosamente a la entidad financiera o a un tercero, si desea que no ingrese a su patrimonio, pues así lo permite el Decreto 2555 de 2010 artículo 2.28.1.2.1, el cual prevé: “g) El locatario podrá ceder a un tercero su derecho a ejercer la opción de adquisición, la cual solo producirá efectos hasta tanto sea aceptada por la entidad autorizada”. En\nconsecuencia, el derecho de opción de compra, contrario a lo dicho por la juez a quo, es susceptible de embargo, pues eventualmente, permitirle al acreedor BANCO DAVIVIENDA S.A., que al final del ejercicio del contrato de leasing, decida sobre la opción referida, podría ayudar a solventar su crédito\nRequisito de valor económico y transferibilidad: para que un juez ordene embargo y remate se requiere que el bien embargable sea determinado o determinable y susceptible de valoración y transferencia. Si la opción puede venderse o transmitirse sin obstáculo contractual (por ejemplo, sin exigir el consentimiento del concedente), entonces existe un mercado potencial y el juez puede autorizar su enajenación forzosa.\nLimitaciones habituales que impiden el remate:\nCláusula expresa de intransferibilidad: si el contrato de leasing establece que la opción es personal y no cedible, esa cláusula puede impedir el remate.\nConsentimiento del otorgante como requisito positivo: si el ejercicio o la cesión de la opción está supeditada al consentimiento del otro contratante, esa condición puede tornar al derecho imprevisible y no rematable hasta que el consentimiento exista.\nDerecho condicional o futuro con incertidumbre relevante: cuando la efectividad del derecho depende de hechos futuros inciertos (por ejemplo, estar “a paz y salvo” en otras obligaciones), esa contingencia reduce o elimina su valor actual y puede impedir el remate.\nVinculación con garantías o cláusulas accesorias que impliquen obligaciones que no puedan transmitirse automáticamente; la existencia de pasivos o de gastos de liquidación derivados del mismo contrato puede hacer inviables la adjudicación práctica del derecho por un tercero.\nJuzgado Tercero Civil del Circuito de Guadalajara de Buga, Valle del Cauca, Auto No. 185 de 22 de febrero de 2024, dentro del proceso ejecutivo promovido por Banco de Occidente S.A. y Fondo Nacional de Garantías contra Rativa Alvarado S.A.S. y Martha Lucía Alvarado Moreno, Rad. 76111310300320220006300. \nhttps://portalhistorico.ramajudicial.gov.co/documents/35758604/170421609/A18520220006300EjecutivoNoReponeConcedeApelacion.pdf/ee99e0c2-19c6-4e64-ae99-45a5d6465497\nEl contrato de leasing —y en particular la cláusula octava referida por el juez— establece que el locatario ostenta la tenencia legítima del bien, pero la propiedad (dominio) sigue perteneciendo al arrendador (el banco) hasta que se ejerza la opción y se perfeccione la transferencia. Por tanto, el bien perseguido no está en el patrimonio del demandado, lo que dificulta aplicar la medida cautelar dirigida a embargar la cosa o su titularidad. \nLa opción de compra, en el punto procesal analizado, es una expectativa\nEl juzgado considera que la opción es una expectativa que solo se consolida “al concluir el contrato” cuando el locatario decide ejercerla; hasta ese momento no integra efectivamente el patrimonio del locatario como derecho realizable. En consecuencia, no reúne la aptitud para constituir objeto de la medida cautelar en el proceso ejecutivo en esa etapa. \nTenencia legítima del locatario versus dominio del arrendador\nEl contrato de leasing confiere al locatario la tenencia y el uso del bien, pero la propiedad (dominio) permanece en cabeza del arrendador hasta que, si se da el supuesto, el locatario ejerza la opción de compra. Por ello, el bien material perseguido no forma parte del patrimonio del demandado y no es, en ese momento, un bien embargable en un proceso ejecutivo contra el locatario. (véase cláusula octava del contrato y análisis \nDiferenciación entre expectativa y derecho consolidado\nLa opción de compra, hasta que no se cumplan las condiciones contractuales y/o el locatario la ejerza, constituye una expectativa o posibilidad futura y no un derecho plenamente consolidado con aptitud de realización. El juzgado considera que las medidas cautelares en el ejecutivo deben recaer sobre bienes que actualmente integren el patrimonio del ejecutado; una mera expectativa no cumple esa función.\nTRIBUNAL SUPERIOR DEL DISTRITO JUDICIAL DE CALI SALA UNITARIA VERBAL NULIDAD ABSOLUTA RAD. NO. 016-2019-00109-01 (2440)\nEn el proceso ya referido, el apoderado judicial de la sociedad demandante, solicitó el embargo y secuestro de “los derechos de crédito y económicos de carácter contractual del que es titular o tenga [la demandada] (…) como locataria (…) en los contratos de leasing financiero (…)” , el 09 de agosto de 2019 el Juzgado negó la cautela, contra esa decisión, la demandante interpuso recurso de reposición y en subsidio apelación, el primero fue resuelto negativamente; en el recurso argumenta que procede el embargo en tanto el locatario dentro del contrato de leasing financiero “tiene unos derechos económicos en cuanto es titular del crédito correspondiente al pago del precio del leasing” permitiéndole posteriormente adquirir el bien objeto del contrato.\nVisto el asunto puesto a consideración bajo jurisprudencia parcialmente transcrita, no se aprecia desacertada la decisión del a quo de negar el embargo de los derechos de crédito que tiene la demandada Importaciones y Exportaciones Fénix S.A.S. como locataria en diversos contratos de leasing con entidades financieras, ciertamente, es claro que por este tipo de contrato la leasing únicamente entrega el uso de un bien conservando el derecho de propiedad para ella misma con el compromiso solamente que al finalizar el término del contrato si se ha pagado la totalidad de los instalamentos, el locatario pueda hacer uso de la opción de compra para adquirir el bien, previo pago de un valor pactado desde cuando se contrató, de ahí que no sea posible embargar derechos inciertos sujetos a una condición, pues los bienes continúan siendo de propiedad de la entidad financiera (leasing) sin que se trate de un derecho de crédito (Art.599 C.G.P.). Suficiente lo considerado para confirmar la providencia objeto de apelación.", "slideIndex": 8, "type": "conference", "sourceLabel": null, "sourceUrl": null}, {"num": "3.3", "title": "Condiciones de embargabilidad e inembargabilidad de los derechos derivados de un contrato de leasing financiero", "category": "El leasing en la fase de negociación", "text": "Razones por las que SÍ se embarga la opción de compra (Juzgado de San Andrés; Tribunal Superior de Buga, Sala Civil Familia)\n1. Es un derecho incorporal que integra el patrimonio del locatario. El patrimonio es una universalidad jurídica que incluye no solo bienes materiales, sino derechos reales, personales e inmateriales (nombre comercial, propiedad intelectual, etc.). La opción de compra encaja en esta categoría de bien incorporal.\n2. No se embarga la propiedad del bien, sino el derecho a adquirirlo. El dominio sigue en cabeza del arrendador; lo que se embarga es un derecho personal distinto, con contenido económico propio, que el locatario tiene frente a la entidad.\n3. Es un derecho con contenido económico y transmisible (patrimonializable). El propio Decreto 2555 de 2010 (art. 2.28.1.2.1 lit. g) reconoce que el locatario puede ceder a un tercero su derecho a ejercer la opción, lo que confirma que está \"en el comercio\" y por tanto es susceptible de operaciones jurídicas.\n4. Cumple los requisitos procesales del embargo, al ser un derecho determinado o determinable y con posibilidad de valoración (arts. 2488 C.C., 599 y 593 C.G.P.).\n5. Utilidad práctica para el acreedor ejecutante: permitiría que, al finalizar el contrato, el acreedor decida sobre la opción para solventar su crédito.\nRazones por las que NO se embarga la opción de compra (Juzgado Tercero Civil de Buga, Auto 185/2024; Tribunal Superior de Cali)\n1. El bien perseguido no está en el patrimonio del deudor. El dominio permanece en el arrendador hasta que se ejerza la opción y se perfeccione la transferencia; no hay nada \"propio\" del locatario que embargar mientras tanto.\n2. Es una mera expectativa, no un derecho consolidado. Solo se consolida cuando el locatario efectivamente ejerce la opción al concluir el contrato; antes de eso no es un derecho actual y realizable.\n3. Las cautelares deben recaer sobre bienes que integren actualmente el patrimonio del ejecutado. Una expectativa futura, condicionada al pago íntegro de los cánones y a la manifestación de voluntad del locatario, no satisface ese requisito.\n4. No es un derecho de crédito en sentido estricto (art. 599 C.G.P.). Es un derecho incierto sujeto a condición (pago total + ejercicio de la opción), y esa condicionalidad impide tratarlo como un crédito exigible y embargable.\n5. Obstáculos adicionales que en la práctica frustran el remate incluso donde se admite el embargo en abstracto: cláusula contractual de intransferibilidad; necesidad de consentimiento previo del arrendador para ceder el derecho; condiciones futuras inciertas como estar \"a paz y salvo\" en otras obligaciones; y vínculo con pasivos o gastos de liquidación del propio contrato que pueden hacer inviable la adjudicación a un tercero.", "slideIndex": 10, "type": "conference", "sourceLabel": null, "sourceUrl": null}, {"num": "3.4", "title": "Inclusión de las obligaciones derivadas del contrato de leasing financiero como pasivo en la insolvencia", "category": "El leasing en la fase de negociación", "text": "ART 539 #3: Una relación completa y actualizada de todos los acreedores, en el orden de prelación de créditos que señalan los artículos 2488 y siguientes del Código Civil.\nLas obligaciones amparadas con garantía mobiliaria constituidas a favor de las empresas vigiladas por la Superintendencia de la Economía Solidaria garantizados mediante aportes sociales individuales y ahorros permanentes en el caso de los fondos de empleados serán considerados de la segunda clase prevista en el artículo 2497 del Código Civil, cumpliendo los requisitos de la Ley 1676 de 2013, hasta el monto de dichos aportes y ahorros, que deberán precisarse y cuantificarse como se exige en el numeral siguiente; si el crédito excediere tal monto, el saldo restante se calificará en la quinta clase.\nSe deberá indicar nombre, domicilio y dirección de cada uno de ellos; dirección de correo electrónico; cuantía, diferenciando capital e intereses, aún en los cánones vencidos de los contratos de leasing, y otros conceptos concretamente señalados; naturaleza de los créditos, incluida la condición de postergados en virtud de la causal primera del artículo 572A; tasas de interés; documentos en que consten; fecha de otorgamiento del crédito y vencimiento, y nombre, domicilio y dirección de la oficina o lugar de habitación de los codeudores, fiadores o avalistas. En caso de no conocer alguna información, el deudor deberá expresarlo.", "slideIndex": 11, "type": "conference", "sourceLabel": null, "sourceUrl": null}, {"num": "4.1", "title": "La apertura de la liquidación y la ruptura patrimonial", "category": "El leasing en la fase de liquidación", "text": "565 #2: La destinación exclusiva de los bienes que el deudor posea a la fecha a pagar las obligaciones anteriores al inicio del procedimiento de liquidación patrimonial. Los bienes e ingresos que el deudor adquiera con posterioridad solo podrán ser perseguidos por los acreedores de obligaciones contraídas después de esa fecha, salvo cuando se trate de procesos ejecutivos de alimentos, en los que se podrán perseguir independientemente de su fecha de causación. En consecuencia, la muerte del deudor no dará lugar a la terminación de este procedimiento.\n565 #3: La incorporación de todas las obligaciones a cargo del deudor que hayan nacido con anterioridad a la providencia de apertura, sin perjuicio de la continuación de los procesos por alimentos. Las obligaciones de carácter alimentario tendrán prelación sobre todas las demás. Los gastos de administración del procedimiento de negociación de deudas se pagarán de preferencia sobre las acreencias incorporadas en la relación definitiva de acreedores que se. hubiere elaborado en este.\n565 #4: La integración de la masa de los activos del deudor, que se conformará por los bienes y derechos de los cuales este sea titular al momento de la apertura de la liquidación patrimonial y los que se hayan reintegrado a su patrimonio en virtud de acciones revocatorias o de simulación que hubieran prosperado…\nART 566 PARAGRAFO 2: Las obligaciones causadas con posterioridad a la fecha de apertura de la liquidación patrimonial podrán ser demandadas ejecutivamente contra el deudor, incluidas aquellas propter rem que afecten a los bienes objeto de adjudicación.", "slideIndex": 12, "type": "conference", "sourceLabel": null, "sourceUrl": null}, {"num": "4.2", "title": "Los cánones del leasing como gastos de administración", "category": "El leasing en la fase de liquidación", "text": "ARTÍCULO 549. GASTOS DE ADMINISTRACIÓN. <Artículo modificado por el artículo 18 de la Ley 2445 de 2025. El nuevo texto es el siguiente:> Los gastos necesarios para la subsistencia del deudor y de las personas a su cargo, así como las obligaciones que este debe continuar sufragando durante el procedimiento de insolvencia desde la aceptación de la solicitud de negociación de deudas hasta que el acuerdo sea aprobado deberán estar al día al momento de la aprobación del mismo y no estarán sujetos al sistema que en el acuerdo de pago se establezca para las demás acreencias.\nTambién se considerarán gastos de administración los aportes a la seguridad social de sus empleados, aún si se hubieren causado antes de la aceptación de la solicitud.\nMientras no se haya decretado la liquidación patrimonial por cualquier causa, los titulares de obligaciones causadas con posterioridad a la aprobación del acuerdo podrán adelantar las gestiones de cobro* coactivo y de restitución previstas en la ley o en el contrato.\nEl deudor no podrá otorgar garantías sin el consentimiento de los acreedores que representen más de la mitad más uno de los votos.\nEl incumplimiento en el pago de los gastos de administración es causal de fracaso del procedimiento de negociación de deudas. En este caso, el acreedor de la obligación en mora informará de esta al conciliador, de lo cual se correrá traslado al deudor, quien podrá allanarse y pagar o convenir con aquel los términos en que solucionará la obligación u oponerse, en: cuyo caso el conciliador suspenderá la audiencia en los términos del artículo 551 con el objeto de que este allegue las pruebas que pretenda hacer valer. Reanudada la audiencia, el conciliador resolverá mediante decisión que solamente admite el recurso de reposición que decidirá de inmediato. Si la decisión favoreciere al deudor o este solucionare el incumplimiento, continuará la audiencia. Si el conciliador encuentra probado el incumplimiento y el deudor no lo soluciona ni logra un acuerdo con el quejoso con tal fin, dejará constancia de todo ello en el acta de fracaso y remitirá lo actuado al juez competente, quien decretará la apertura de la liquidación patrimonial si está conforme con la conclusión del conciliador. En caso de no estarlo, así lo declarará mediante auto que no admite recurso y devolverá la actuación al conciliador para que continúe con la audiencia.\nEn caso de que se decrete la liquidación patrimonial, los gastos de administración y las obligaciones causadas durante la ejecución del acuerdo insolutos podrán presentarse a dicho trámite, y los correspondientes procesos de ejecución iniciados contra el deudor estarán sujetos a lo dispuesto en el numeral 7 del artículo 565.\nPARÁGRAFO. Que el acreedor al que se incumplió sea el centro de conciliación o notaría no constituirá causal de impedimiento del conciliador, y el centro o notaría estará representado por su director o notario, según sea el caso, o por apoderado designado para el efecto.\nLEY 1116 DE 2006, ARTÍCULO 71. OBLIGACIONES POSTERIORES AL INICIO DEL PROCESO DE INSOLVENCIA. <Ver Notas del Editor> Las obligaciones causadas con posterioridad a la fecha de inicio del proceso de insolvencia son gastos de administración y tendrán preferencia en su pago sobre aquellas objeto del acuerdo de reorganización o del proceso de liquidación judicial, según sea el caso, y podrá exigirse coactivamente su cobro, sin perjuicio de la prioridad que corresponde a mesadas pensionales y contribuciones parafiscales de origen laboral, causadas antes y después del inicio del proceso de liquidación judicial. Igualmente tendrán preferencia en su pago, inclusive sobre los gastos de administración, los créditos por concepto de facilidades de pago a que hace referencia el parágrafo del artículo 10 y el parágrafo 2o del artículo 34 de esta ley.\nA menos que en el inventario hubiera: recursos en efectivo que pudieran destinarse al efecto, el deudor correrá con los gastos de la liquidación y al respecto se podrán aplicar las causales y el trámite correspondientes al desistimiento tácito para que el juez termine el proceso, aunque este no se haya iniciado a solicitud del deudor.", "slideIndex": 13, "type": "conference", "sourceLabel": null, "sourceUrl": null}, {"num": "4.3", "title": "La reactivación de los procesos de restitución de tenencia", "category": "El leasing en la fase de liquidación", "text": "565 PARAGRAFO 3: Los procesos de restitución de tenencia de los bienes entregados en leasing contra el deudor continuarán su curso. Los créditos insolutos que dieron origen al proceso de restitución se sujetarán a las reglas de la liquidación.", "slideIndex": 14, "type": "conference", "sourceLabel": null, "sourceUrl": null}, {"num": "5.1", "title": "Renegociación y terminación unilateral del leasing", "category": "Herramientas de la Ley 2445 de 2025", "text": "ART 545 #8: El deudor admitido a un trámite de insolvencia podrá buscar la renegociación de mutuo acuerdo de los contratos de' arrendamiento comercial o financiero (leasing) de los que sea parte arrendataria o locataria. En caso de que no se logre la negociación, cualquiera de las partes podrá dar por terminado el contrato unilateralmente con solamente comunicar tal decisión a su contraparte y al I conciliador, quedando el deudor sujeto a la entrega inmediata del bien en las condiciones previstas en el contrato y a las sanciones contractuales o legales del caso, decididas mediante incidente por el juez del concurso, las que harán parte del pasivo a negociar o liquidar. En todo caso, la terminación del contrato por iniciativa del deudor podrá darse cuando acredite las siguientes circunstancias: (i) el contrato es uno de tracto sucesivo que aún se encuentra en proceso de ejecución, y (ii) las prestaciones a cargo del deudor resultan excesivas, tomando en consideración el precio de las operaciones equivalentes o de reemplazo que el deudor podría obtener en el mercado.\nAl momento de comunicar tal decisión, el deudor deberá presentar un análisis de la relación costo-beneficio para el propósito de la negociación de llevarse a cabo la terminación, en la cual se tome en cuenta la indemnización a cuyo pago podría verse sujeto el deudor con ocasión de la terminación.\n? Habilitación: deudor admitido en insolvencia. \n? Intento de renegociación de mutuo acuerdo con la arrendadora. \n? Acuerdo ? contrato continúa | No acuerdo ? se habilita terminación. \n? Terminación unilateral: cualquiera de las partes, solo comunicando a la contraparte y al conciliador. \n? Si termina el deudor: debe acreditar (i) tracto sucesivo en ejecución y (ii) prestaciones excesivas frente al mercado. \n? Debe presentar análisis costo-beneficio, incluyendo la indemnización eventual. \n? Entrega inmediata del bien + sanciones contractuales/legales aplicables. \n? Controversias sobre sanciones ? incidente ante el juez del concurso. \n? Resultado se incorpora al pasivo a negociar o liquidar.", "slideIndex": 15, "type": "conference", "sourceLabel": null, "sourceUrl": null}, {"num": "5.2", "title": "Acuerdos bilaterales sobre el crédito de leasing", "category": "Herramientas de la Ley 2445 de 2025", "text": "ART 553 #3: Debe comprender a la totalidad de los acreedores objeto de la negociación. No obstante, en caso de que no pueda lograr un acuerdo con todos los acreedores, el deudor podrá realizar, en esa misma audiencia, acuerdos bilaterales con acreedores que tengan garantía real o arrendamiento financiero sobre el inmueble que sea su vivienda o sobre muebles que constituyan un activo necesario para su actividad productiva o su vida de relación, los que tendrán plenos efectos entre las partes. En tal caso los créditos y activos de que se trate se excluirán de la liquidación patrimonial y los que tengan tales garantías u objeto se pagarán por el deudor en los términos contemplados en dichos acuerdos, que no podrán ser impugnados sino por la causal de no cumplir los bienes con las condiciones previstas en este numeral.\nLos acuerdos bilaterales no podrán realizarse con los cónyuges, compañeros permanentes o parientes dentro del cuarto grado de consanguinidad, segundo de afinidad o primero civil del deudor.\nReglas para el acuerdo bilateral — art. 553 #3 CGP\n1. Regla general (el punto de partida): el acuerdo de negociación de deudas debe, en principio, comprender a la totalidad de los acreedores del proceso.\n2. Excepción que habilita el acuerdo bilateral: solo procede si no se logra un acuerdo con todos los acreedores; es una salida subsidiaria, no la primera opción.\n3. Con quién sí se puede pactar: únicamente con acreedores que tengan garantía real o arrendamiento financiero (leasing) sobre el bien — no aplica a acreedores quirografarios/sin garantía.\n4. Sobre qué bienes: solo sobre (i) el inmueble que sea la vivienda del deudor, o (ii) bienes muebles que constituyan un activo necesario para su actividad productiva o su vida de relación. Fuera de esos dos supuestos, no cabe el acuerdo bilateral.\n5. Momento procesal: debe celebrarse en la misma audiencia de negociación de deudas.\n6. Efectos: el acuerdo produce plenos efectos entre las partes que lo suscriben, sin necesidad de aprobación de los demás acreedores.\n7. Exclusión de la masa: los créditos y activos cobijados por el acuerdo bilateral quedan excluidos de la liquidación patrimonial.\n8. Forma de pago: el deudor paga esas obligaciones en los términos pactados en el propio acuerdo, no bajo las reglas generales de la negociación o liquidación.\n9. Causal única de impugnación: el acuerdo solo puede atacarse por una causal — que el bien no cumpla las condiciones del numeral (que no sea realmente vivienda o activo productivo necesario, o que el acreedor no tenga garantía real o leasing sobre él). No puede impugnarse por otras razones. Aquí conecta directamente con la Regla 2 de las conclusiones: si la entidad pretende que el acuerdo bilateral cubra \"toda la cartera\" y no solo la obligación garantizada con ese bien, se sale de esta causal habilitante y queda expuesto a impugnación.\n10. Prohibición subjetiva: no pueden celebrarse acuerdos bilaterales con el cónyuge, compañero permanente, o parientes del deudor dentro del cuarto grado de consanguinidad, segundo de afinidad o primero civil — la misma desconfianza hacia partes relacionadas que vimos en la causal primera de postergación del artículo 572A.", "slideIndex": 16, "type": "conference", "sourceLabel": null, "sourceUrl": null}, {"num": "5.3", "title": "Acuerdos bilaterales en la liquidación", "category": "Herramientas de la Ley 2445 de 2025", "text": "ARTÍCULO 569. ACUERDO DE NEGOCIACIÓN DE DEUDAS DENTRO DE LA LIQUIDACIÓN PATRIMONIAL. <Artículo modificado por el artículo 35 de la Ley 2445 de 2025. El nuevo texto es el siguiente:> En cualquier momento de la liquidación y antes de la celebración de la audiencia de adjudicación, el deudor y un número plural de acreedores que representen más del cincuenta por ciento (50%) de los votos determinados en la liquidación o, en su defecto, de las que consten en la relación definitiva de acreencias de la negociación podrán celebrar un acuerdo de negociación de deudas dentro de la liquidación patrimonial. El acuerdo deberá reunir los mismos requisitos exigidos en los artículos 553 y 554, y quedará sujeto, en todo, a lo previsto sobre el mismo en el presente título, para su aprobación y verificación de legalidad. Igualmente, podrán convenirse los acuerdos parciales de que trata la segunda parte del numeral 3 del artículo 553, en los términos y con las consecuencias en él previstas.", "slideIndex": 16, "type": "conference", "sourceLabel": null, "sourceUrl": null}, {"num": "5.4", "title": "Cláusula de \"cross default\" o incumplimiento cruzado", "category": "Herramientas de la Ley 2445 de 2025", "text": "Una cláusula cross default (o de incumplimiento cruzado) es una estipulación contractual, típica de operaciones de financiación, según la cual el incumplimiento de una obligación distinta, ya sea con la misma entidad o con un tercero se considera automáticamente un incumplimiento del contrato en el que está incluida la cláusula, aunque en ese contrato específico el deudor esté cumpliendo normalmente.\nLa cláusula analizada es la siguiente: \"para poder ejercer la opción de compra en el contrato de leasing, el locatario debe estar al día en todos los productos financieros que tenga con la entidad\" (créditos de consumo, tarjetas de crédito, otros leasings, sobregiros, etc.)\nNORMAL APLICABLES TRANSVERSALES \n* Ley 1328 de 2009 : Estatuto del Consumidor Financiero\n* Ley 1480 de 201: Estatuto del Consumidor\n* Circular 018/2016: Contiene el listado con la totalidad de las cláusulas abusivas\n* Circular 039/2011: regula y prohíbe las prácticas y cláusulas abusivas en los contratos de adhesión del sector financiero\n* Circular Básica Jurídica\nASPECTOS PARA ANALIZAR SOBRE LA VALIDEZ DE LA CLAUSULA\n1. Naturaleza de la opción de compra: derecho esencial y tipificante del leasing, \"ganado\" con el pago de los cánones, no es una facultad discrecional del arrendador.\n2. Desequilibrio injustificado (art. 12, Ley 1328/2009): ventaja unilateral para la entidad sin contraprestación que la justifique.\n3. Abuso de posición dominante (art. 7 lit. e): el leasing se usa como palanca de cobro de deudas ajenas al contrato.\n4. Analogía con prácticas ya sancionadas por la SFC: similar a exigir requisitos sobrevinientes no pactados al inicio y a la prohibición de \"venta atada\".\n5. Falta de conexidad / relatividad de las obligaciones: cada contrato es autónomo, salvo conexidad real y proporcional.\n6. Déficit de transparencia (art. 3, Ley 1328/2009): cláusula genérica que no permite dimensionar el riesgo real asumido.\n7. Vulneración de la buena fe contractual (art. 871 C.Co / art. 1603 C.C.): desvía la finalidad del derecho hacia un mecanismo de cobro coactivo.\n8. Argumentos de defensa de la entidad: libertad contractual y gestión de riesgo, resultaría débil frente al carácter imperativo del Estatuto del Consumidor Financiero.\n9. Consecuencia jurídica: cláusula \"no escrita\", ineficaz de pleno derecho (art. 11), reclamable ante Defensor del Consumidor Financiero, función jurisdiccional de la SFC o justicia ordinaria.", "slideIndex": 17, "type": "conference", "sourceLabel": null, "sourceUrl": null}, {"num": "6.1", "title": "Pérdida al derecho de descargue por omisiones", "category": "El leasing en la adjudicación patrimonial", "text": "No habrá lugar a este efecto si, mediante incidente promovido por cualquier acreedor, el juez encuentra que en la solicitud de cualquiera de los procedimientos de insolvencia el deudor dolosamente omitió información que claramente se pudiera considerar relevante para la torna de decisiones por parte de los acreedores, corno ingresos, bienes o créditos los ocultó o simuló deudas o que durante el trámite de la negociación de deudas o de la convalidación de acuerdos privados se abstuvo de actualizar la información que dispone el numeral 4 del artículo 545 en relación con su situación de crisis económica y direcciones de notificación o que realizó conductas activas u omisivas que hubieran impedido o dificultado la venta de un activo cuya posibilidad se prevé en el artículo 570A. Tampoco habrá lugar a aplicar dicha regla si prosperan las acciones revocatorias o de simulación que se propongan en el curso de los procedimientos, ni respecto de los saldos insolutos por obligaciones alimentarias. Igualmente perderá tal beneficio el deudor que con dolo o culpa grave hubiera ocasionado el deterioro de los activos que componen el inventario a adjudicar o lo hubiere permitido habiendo podido evitarlo, a menos que antes de iniciarse la audiencia de adjudicación o durante su desarrollo compense en dinero efectivo el perjuicio causado a sus acreedores o llegue con ellos a un acuerdo sobre la forma de hacerlo.", "slideIndex": 18, "type": "conference", "sourceLabel": null, "sourceUrl": null}, {"num": "6.2", "title": "Adjudicación de los derechos de leasing a un acreedor diferente a la entidad financiera", "category": "El leasing en la adjudicación patrimonial", "text": "ART 564 #1, inciso 6: A menos que en el inventario hubiera: recursos en efectivo que pudieran destinarse al efecto, el deudor correrá con los gastos de la liquidación y al respecto se podrán aplicar las causales y el trámite correspondientes al desistimiento tácito para que el juez termine el proceso, aunque este no se haya iniciado a solicitud del deudor.\nLa adjudicación de los derechos derivados de un contrato de leasing a favor de un acreedor distinto de la entidad financiera no puede entenderse como una simple transferencia de un derecho de crédito. El leasing constituye una relación jurídica compleja que incorpora derechos, obligaciones periódicas, garantías, administración del contrato y una eventual opción de compra, elementos que conforman un equilibrio contractual construido entre el locatario y la entidad financiera. En consecuencia, la sustitución de la entidad por un tercero modifica sustancialmente la dinámica del contrato y excede el alcance de una mera adjudicación patrimonial.\nDesde esta perspectiva, la autorización previa de la entidad financiera constituye un presupuesto indispensable para la validez y eficacia de dicha adjudicación. Permitir que un tercero asuma la posición contractual sin el consentimiento del titular original implica alterar la voluntad negocial de las partes, afectar la administración del contrato, la gestión de las garantías, la eventual restitución del bien y el ejercicio de la opción de compra, desconociendo los principios de buena fe, autonomía de la voluntad y seguridad jurídica que gobiernan las relaciones contractuales.\nAdicionalmente, la adjudicación puede resultar materialmente inviable cuando la liquidación del contrato de leasing arroja un pasivo o genera obligaciones pendientes que deben ser asumidas durante la terminación de la operación. En tales eventos, la transferencia de los derechos a un tercero sin que exista un acuerdo previo sobre la asunción de dichas cargas implica trasladar riesgos que nunca fueron aceptados por las partes, pudiendo generar conflictos procesales, económicos y patrimoniales tanto para el adjudicatario como para el arrendatario y la propia entidad financiera.\nPor lo anterior, desde una perspectiva jurídica, comercial y financiera, la adjudicación de los derechos de un contrato de leasing a favor de un acreedor distinto de la entidad financiera debe estar condicionada a la autorización expresa de esta última, así como a la verificación de que el adjudicatario cuenta con la capacidad para asumir las obligaciones inherentes al contrato y los eventuales pasivos derivados de su liquidación. Solo bajo estas condiciones se preserva el equilibrio contractual, se protege la seguridad jurídica de las partes y se evita que la adjudicación se convierta en una fuente de litigios e ineficacia jurídica.\n? Autorización de la entidad financiera. La cesión de la posición contractual del locatario no opera de pleno derecho. Conforme al artículo 887 del Código de Comercio, y a la práctica uniforme del leasing financiero, la sustitución del locatario por un tercero requiere el consentimiento previo de la arrendadora. Una adjudicación judicial no puede imponerle a la entidad financiera un nuevo contratante sin su aquiescencia, porque alteraría unilateralmente un elemento esencial del contrato: la evaluación de riesgo crediticio de su contraparte. \n? Continuidad de la ejecución contractual. El leasing es un contrato de tracto sucesivo. La \"adjudicación\" de derechos no extingue las obligaciones pendientes — cánones, seguros, impuestos, mantenimiento. El adjudicatario tendría que asumir la posición contractual íntegra (derechos y obligaciones), no solo recibir un beneficio económico aislado. \n? Restitución y liquidación como alternativa necesaria. Si la arrendadora no autoriza la cesión, o el acreedor no puede asumir la posición contractual, la consecuencia jurídica no es la adjudicación, sino la restitución del bien y la liquidación de las cuentas del contrato conforme a sus reglas propias. \n? Riesgo de pasivo en la liquidación. Al liquidar el contrato puede resultar que lo adeudado (cánones vencidos, cláusula penal, valor residual, gastos de restitución) supere el valor de mercado del bien. En ese escenario no hay activo que adjudicar: hay un pasivo adicional para el deudor y, en consecuencia, nada aprovechable para el acreedor ejecutante. \n? Analogía con la imposibilidad de remate. Este supuesto es estructuralmente idéntico al reconocido para bienes que salen a remate sin valor neto realizable: si no hay un remanente positivo, no puede rematarse ni adjudicarse útilmente, porque no existe nada que efectivamente pueda trasladarse en pago.", "slideIndex": 18, "type": "conference", "sourceLabel": null, "sourceUrl": null}, {"num": "7", "title": "Conclusiones — Cinco reglas prácticas", "category": "Conclusiones", "text": "Regla 1 — La doble capacidad de pago. Antes de encaminar al cliente hacia un acuerdo de pago, hay que verificar que tenga una doble capacidad de pago: (i) la de seguir asumiendo el canon del leasing —esté al día o en mora— en las condiciones actuales del contrato, salvo que se logre su renegociación dentro del proceso; y (ii) la de cubrir, en paralelo, el resto de las obligaciones relacionadas en el listado de acreedores. Sin ambas capacidades a la vez, el acuerdo de pago no es una salida realista.\nRegla 2 — El blindaje patrimonial frente al cross default. Si la estrategia es la renegociación o un acuerdo bilateral con la entidad de leasing, hay que revisar antes toda la relación del cliente con esa entidad, para confirmar que no tenga otras obligaciones vigentes con ella. Si las tiene, es probable que la entidad condicione el acuerdo bilateral a cubrir toda la cartera, no solo la obligación garantizada con el bien. Eso desborda el alcance del artículo 553 numeral 3 del CGP —limitado al crédito con garantía real o leasing sobre vivienda o activo productivo necesario— y constituye causal de impugnación por violar la norma y el orden de prelación de créditos.\nRegla 3 — Terminar a tiempo cuando el leasing es insostenible. Si el objetivo es la liquidación patrimonial y se prevé que el cliente no podrá seguir pagando los cánones desde la admisión —esté o no ya en mora—, hay que buscar la terminación unilateral desde la fase de negociación. Los cánones causados después de la admisión son deuda nueva y ejecutable como gasto de administración; dejar el contrato vigente sin capacidad real de pago solo acumula pasivo evitable.\nRegla 4 — Proteger la opción de compra cuando el cliente está en mora y quiere conservar el leasing. Si el cliente entra a negociación ya en mora y quiere seguir pagando sin perder el bien, el riesgo es que el valor en mora, al quedar incluido en la negociación, comprometa el ejercicio futuro de la opción de compra. Una salida es sostener que el bien no es adjudicable, no relacionarlo como activo, evitar que se adjudique, y pagar aparte lo que estuvo en mora una vez surtida la adjudicación para poder ejercer la opción. Esto exige pactarlo expresamente con la entidad financiera; no opera de forma automática.\nRegla 5 — Cuando el cliente está al día: deuda en cero, pero sin activo que declarar. Si el cliente está al día en el canon y quiere seguirlo estando durante la liquidación, la recomendación es relacionar la deuda del leasing en cero —porque efectivamente no hay cánones vencidos que declarar, así que no hay omisión— pero no incluir el leasing como activo en el inventario. La base es que, mientras el contrato siga vigente y la opción no se haya ejercido, no hay un derecho consolidado sino una mera expectativa condicionada, en línea con el Auto 185/2024 de Buga y el Tribunal de Cali.\nEsto funciona si se cumplen tres condiciones: que el deudor siga al día y no incumpla, que ningún acreedor pida incluir el leasing como activo-derecho en la liquidación, y que efectivamente se llegue a la adjudicación sin haberlo incluido. Si se sostiene, el deudor podrá ejercer la opción de compra más adelante: como ese derecho se consolida después de la apertura, cae bajo la regla de ruptura patrimonial del artículo 565 numeral 2 del CGP —los bienes adquiridos con posterioridad a la apertura solo pueden perseguirlos los acreedores de obligaciones posteriores a esa fecha—, de modo que las deudas incluidas en la liquidación no pueden perseguir ese bien.\nllegado el momento, la entidad se niega a otorgar la opción de compra alegando obligaciones distintas en mora —pese a que el deudor cumplió a cabalidad el contrato de leasing—, eso es exactamente la cláusula de cross default abusiva que analizamos al comienzo de esta conferencia. Esa negativa se impugna en un proceso adicional, ante la Superintendencia Financiera de Colombia o ante la jurisdicción ordinaria.", "slideIndex": 19, "type": "conference", "sourceLabel": null, "sourceUrl": null}, {"num": "C1", "title": "Diferencia entre leasing financiero y leasing operativo", "category": "Contexto complementario (fuera de la conferencia)", "type": "external", "sourceLabel": "Superintendencia Financiera de Colombia · Oficio Supersociedades 220-122670 de 2019", "sourceUrl": "https://www.superfinanciera.gov.co/loader.php?lServicio=Tools2&lTipo=descargas&lFuncion=descargar&idFile=83197", "slideIndex": null, "text": "La conferencia se enfoca en el leasing financiero, pero en la práctica también existe el leasing operativo, y distinguirlos ayuda a entender por qué el financiero se trata como una operación de endeudamiento. El leasing financiero es un negocio exclusivo de las compañías de financiamiento vigiladas por la Superintendencia Financiera: se entrega un bien en arrendamiento financiando su uso a cambio de cánones, y siempre existe una opción de compra pactada desde el inicio a favor del locatario. El leasing operativo, en cambio, es un simple contrato de arrendamiento sin opción de compra (o con una opción excepcional, por el valor comercial del bien): puede ofrecerlo cualquier persona natural o jurídica con recursos propios, sin necesidad de vigilancia de la Superintendencia Financiera, y no se considera una operación de endeudamiento. Esta distinción es la que explica por qué solo el leasing financiero se declara como activo y pasivo condicionado en un proceso de insolvencia — el operativo, al no tener opción de compra ni naturaleza crediticia, no genera ese mismo tratamiento."}, {"num": "C2", "title": "Qué cambió en general con la Ley 2445 de 2025", "category": "Contexto complementario (fuera de la conferencia)", "type": "external", "sourceLabel": "Universidad de Medellín · Facultad de Derecho — resumen de la reforma", "sourceUrl": "https://derecho.udemedellin.edu.co/reformas-en-insolvencia-para-personas-naturales-no-comerciantes-congreso-promulga-la-ley-2445-de-2025/", "slideIndex": null, "text": "La conferencia cita artículos puntuales de la Ley 2445 de 2025 en el contexto del leasing, pero la reforma tiene un alcance más amplio sobre el régimen de insolvencia de persona natural no comerciante (Ley 1564 de 2012). Entre los cambios generales están: se redujo el umbral de cesación de pagos exigido al deudor, de tener que demostrar mora en el 50% de sus obligaciones a solo el 30%; se amplió la cobertura a pequeños comerciantes con activos inferiores a 1.000 salarios mínimos; se simplificaron los trámites de negociación de deudas, convalidación de acuerdos privados y liquidación patrimonial; se redujeron los tiempos procesales (por ejemplo, de 20 a 10 días entre la notificación y la primera audiencia); se habilitaron los procedimientos virtuales ante centros de conciliación y notarías, beneficiando a deudores domiciliados en cualquier parte del país o en el exterior; y desde el inicio del proceso se suspenden los descuentos automáticos por libranza. El objetivo declarado de la reforma es facilitar la reintegración económica del deudor sin desproteger el crédito de los acreedores."}, {"num": "C3", "title": "Qué es el proceso de insolvencia de persona natural en Colombia (panorama general)", "category": "Contexto complementario (fuera de la conferencia)", "type": "external", "sourceLabel": "Cámara de Comercio de Medellín — cartilla de régimen de insolvencia", "sourceUrl": "https://www.camaramedellin.com.co/Portals/0/Documentos/Cartilla%20Insolvencia%20.pdf", "slideIndex": null, "text": "La conferencia asume que el público ya conoce el proceso general de insolvencia de persona natural, porque se enfoca específicamente en el leasing dentro de ese proceso. Como contexto: el régimen de insolvencia de persona natural no comerciante, regulado en el Título IV de la Ley 1564 de 2012 (Código General del Proceso, arts. 531 a 576), permite a una persona natural que no es comerciante — es decir, que no realiza actos de comercio de forma habitual y profesional, como un empleado o un profesional independiente — negociar todas sus deudas con bancos y demás acreedores en un solo trámite. El proceso tiene tres posibles vías: (1) negociación de deudas, donde se busca un acuerdo de pago global con los acreedores en una audiencia, dentro de un plazo de 60 días prorrogables por 30 más; (2) convalidación de acuerdos privados ya negociados directamente con los acreedores; y (3) liquidación patrimonial, que se activa si no se logra un acuerdo o si este se incumple gravemente — ahí se inventarían y venden los bienes del deudor para pagar a los acreedores, que es precisamente el escenario donde surgen las preguntas sobre qué pasa con un leasing vigente."}];
