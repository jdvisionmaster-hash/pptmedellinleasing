    // document mints the blobs for its OWN frames, obtaining page text

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);

      // root's never-relay rule) are what hold in fully opaque chains

    // consumers read these Blobs directly. Survives the swap like the error sink.

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<html><head>\n\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"fdaedb1f-4899-4e98-a651-e1e956dcc3de\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n  <style>/* =========================================================================\n   ATRIA Design System — Core Tokens\n   ATRIA Consultoría Legal y Financiera S.A.S\n   Colombian legal consultancy specializing in insolvency processes.\n\n   Two product surfaces:\n     1. Social-media carousels (Instagram / 1080×1350)\n     2. Marketing site for the practice (recreation)\n\n   The visual language is built on a tight 4-color palette:\n     navy  → trust, legality, \"the system\"\n     red   → urgency, warnings, \"mala fe\" (bad faith), CTAs\n     gold  → premium, official seals, badge accent\n     steel → wordmark grey, supporting copy on light\n\n   Typography pairs:\n     Oswald (condensed grotesque) for ALL headlines, in UPPERCASE.\n     Hong Kong (humanist sans) for body, sub-heads, and the few sentence-cased\n     supporting lines.\n\n   ========================================================================= */\n\n/* --- Webfonts ------------------------------------------------------------ */\n\n@font-face {\n  font-family: \"Oswald\";\n  src: url(\"d23f8b30-b520-4ecd-b75c-64c1750854d5\") format(\"truetype-variations\");\n  font-weight: 200 700;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Hong Kong\";\n  src: url(\"8ae4fbe1-a678-4e88-abf9-68a164af5243\") format(\"opentype\");\n  font-weight: 100;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Hong Kong\";\n  src: url(\"0115f4af-40f2-48da-8e4f-3429498db30f\") format(\"opentype\");\n  font-weight: 300;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Hong Kong\";\n  src: url(\"bffd7173-54e9-41da-a1de-55b5bce12068\") format(\"opentype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Hong Kong\";\n  src: url(\"2b0afe8f-ecb8-4329-8aba-2f313850a73d\") format(\"opentype\");\n  font-weight: 400;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Hong Kong\";\n  src: url(\"27dceeb9-bb24-4c6f-a0dc-e0e2679fb6ee\") format(\"opentype\");\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Hong Kong\";\n  src: url(\"1f730366-7edd-4cf5-b3b5-b758689dae36\") format(\"opentype\");\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Hong Kong\";\n  src: url(\"92c02986-e916-441d-835f-2ae89cd9d338\") format(\"opentype\");\n  font-weight: 700;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Hong Kong\";\n  src: url(\"dc7bafbc-0f3b-49ef-b91e-9bf88c8050c7\") format(\"opentype\");\n  font-weight: 900;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* --- Tokens -------------------------------------------------------------- */\n\n:root {\n  /* ----- Brand colors -----\n     Source of truth: the official ATRIA brand-palette sheet\n     (see assets/brand-palette-reference.png). Seven anchor values;\n     the *-100 / *-300 / *-700 / *-950 steps around each anchor are\n     derivative tints/shades tuned for gradients and hover states.    */\n\n  /* Navy — the dominant brand color, used on ~70% of surfaces.\n     Anchor: #003173  (C100 M85 Y5 K30)                              */\n  --atria-navy-950: #001A3F;        /* darker, for gradient deep stop      */\n  --atria-navy-900: #003173;        /* ★ PRIMARY NAVY (brand sheet)        */\n  --atria-navy-800: #003F8C;        /* mid step toward link blue           */\n  --atria-navy-700: #00529F;        /* ★ link / interactive (brand sheet)  */\n  --atria-navy-500: #2E78C0;        /* hover lift on link blue             */\n  --atria-navy-300: #94BEE6;        /* ★ light accent blue (brand sheet)   */\n  --atria-navy-100: #D4E5F5;        /* tinted pill background on navy      */\n\n  /* Red — warnings, \"mala fe\", CTAs, alert highlights.\n     Anchor: #E8412A  (C0 M85 Y87 K0)                                 */\n  --atria-red-900:  #A82516;        /* deep red, pill borders              */\n  --atria-red-700:  #C8311F;        /* warning red                         */\n  --atria-red-500:  #E8412A;        /* ★ PRIMARY RED (brand sheet)         */\n  --atria-red-400:  #F25C44;        /* energetic CTA red, hover            */\n  --atria-red-200:  #F9C5BA;        /* soft red pill background            */\n\n  /* Gold — premium / official seal accent. Rare; reserved.\n     Anchor: #B0874E  (C26 M42 Y72 K15)                               */\n  --atria-gold-700: #8A6738;\n  --atria-gold-500: #B0874E;        /* ★ GOLD (brand sheet)                */\n  --atria-gold-300: #D2B181;\n\n  /* Steel — wordmark grey + neutral body on light backgrounds.\n     Anchors: #687687 (C61 M43 Y32 K15)  +  #BABDC6 (C31 M22 Y17 K0)  */\n  --atria-steel-900: #2A3340;\n  --atria-steel-700: #4D5969;\n  --atria-steel-500: #687687;       /* ★ STEEL (brand sheet)               */\n  --atria-steel-300: #BABDC6;       /* ★ light steel (brand sheet)         */\n  --atria-steel-100: #E5E7EC;\n\n  /* Surfaces */\n  --atria-white:    #FFFFFF;\n  --atria-paper:    #F7F8FA;        /* off-white page background            */\n  --atria-ink:      #0E1422;        /* body text on light                   */\n\n  /* ----- Semantic color roles ----- */\n\n  --fg-1:           var(--atria-ink);       /* primary text on light        */\n  --fg-2:           var(--atria-steel-700); /* secondary text on light      */\n  --fg-3:           var(--atria-steel-500); /* tertiary / captions          */\n  --fg-on-navy-1:   #FFFFFF;\n  --fg-on-navy-2:   rgba(255,255,255,0.72);\n  --fg-on-navy-3:   rgba(255,255,255,0.45);\n  --fg-on-red-1:    #FFFFFF;\n  --fg-on-red-2:    rgba(255,255,255,0.78);\n\n  --bg-page:        var(--atria-paper);\n  --bg-surface:     var(--atria-white);\n  --bg-navy:        var(--atria-navy-900);\n  --bg-navy-deep:   var(--atria-navy-950);\n\n  --accent-warn:    var(--atria-red-500);\n  --accent-cta:     var(--atria-red-400);\n  --accent-premium: var(--atria-gold-500);\n  --accent-link:    var(--atria-navy-500);\n\n  --border-soft:    rgba(255,255,255,0.18); /* the signature inner frame    */\n  --border-on-light: rgba(14,20,34,0.10);\n\n  /* ----- Signature gradients -----\n     Built on the brand anchors only. The deeper stops are computed\n     darker tints of #003173 / #E8412A so the gradient stays in family. */\n  --grad-navy:      linear-gradient(180deg, #00529F 0%, #003173 55%, #001A3F 100%);\n  --grad-red:       linear-gradient(180deg, #F25C44 0%, #E8412A 55%, #A82516 100%);\n  --grad-split:     linear-gradient(95deg,  #A82516 0%, #6A1A3C 45%, #003173 100%);\n  --grad-radial-navy: radial-gradient(120% 90% at 50% 10%, #00529F 0%, #003173 60%, #001A3F 100%);\n  --grad-radial-red:  radial-gradient(120% 90% at 50% 10%, #F47862 0%, #E8412A 55%, #A82516 100%);\n\n  /* ----- Typography ----- */\n  --font-display:   \"Oswald\", \"Arial Narrow\", system-ui, sans-serif;\n  --font-body:      \"Hong Kong\", \"Inter\", system-ui, sans-serif;\n\n  /* Heading sizing — print/social heavy; web should clamp() these down. */\n  --fs-display-xl:  96px;   /* hero headlines on social cards     */\n  --fs-display-lg:  72px;\n  --fs-display-md:  56px;\n  --fs-h1:          44px;\n  --fs-h2:          32px;\n  --fs-h3:          24px;\n  --fs-body-lg:     20px;\n  --fs-body:        16px;\n  --fs-caption:     13px;\n  --fs-micro:       11px;\n\n  --lh-display:     0.95;\n  --lh-heading:     1.1;\n  --lh-body:        1.45;\n\n  --ls-display:     -0.01em;        /* slight optical tightening on caps  */\n  --ls-eyebrow:     0.12em;         /* uppercase eyebrow tracking         */\n\n  /* ----- Shape, spacing, motion ----- */\n  --radius-xs:      6px;\n  --radius-sm:      10px;\n  --radius-md:      16px;\n  --radius-lg:      24px;\n  --radius-xl:      36px;          /* signature pill radius for chips    */\n  --radius-pill:    9999px;\n  --radius-card:    28px;          /* social-card inner-frame radius     */\n\n  --space-1:        4px;\n  --space-2:        8px;\n  --space-3:        12px;\n  --space-4:        16px;\n  --space-5:        24px;\n  --space-6:        32px;\n  --space-7:        48px;\n  --space-8:        64px;\n  --space-9:        96px;\n\n  --shadow-sm:      0 1px 2px rgba(7,25,58,0.10);\n  --shadow-md:      0 8px 24px -8px rgba(7,25,58,0.25);\n  --shadow-lg:      0 24px 60px -20px rgba(7,25,58,0.35);\n  --shadow-warn:    0 12px 28px -10px rgba(239,58,42,0.45);\n\n  --ease-out:       cubic-bezier(0.16, 1, 0.3, 1);\n  --ease-in-out:    cubic-bezier(0.65, 0, 0.35, 1);\n  --dur-fast:       140ms;\n  --dur-base:       240ms;\n  --dur-slow:       420ms;\n}\n\n/* --- Base type roles ----------------------------------------------------- */\n\n.atria-display, .atria-h1, .atria-h2, .atria-h3, .atria-eyebrow {\n  font-family: var(--font-display);\n  font-weight: 700;\n  letter-spacing: var(--ls-display);\n  line-height: var(--lh-heading);\n  text-transform: uppercase;\n}\n\n.atria-display    { font-size: var(--fs-display-lg); line-height: var(--lh-display); }\n.atria-display-xl { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; font-size: var(--fs-display-xl); line-height: var(--lh-display); letter-spacing: var(--ls-display); }\n.atria-h1         { font-size: var(--fs-h1); }\n.atria-h2         { font-size: var(--fs-h2); }\n.atria-h3         { font-size: var(--fs-h3); }\n\n.atria-eyebrow {\n  font-size: var(--fs-caption);\n  letter-spacing: var(--ls-eyebrow);\n  font-weight: 500;\n}\n\n.atria-body, .atria-body-lg, .atria-caption {\n  font-family: var(--font-body);\n  font-weight: 400;\n  line-height: var(--lh-body);\n  letter-spacing: 0;\n  text-transform: none;\n}\n.atria-body-lg e=\"position:relative; color: rgba(255,255,255,0.82); font-size: var(--type-subtitle); margin-top: 28px; max-width: 1300px;\">No comerciante y pequeña comerciante<\/div>\n  <div style=\"position:relative; margin-top:16px; font-family: var(--font-body); font-size: var(--type-small); color: rgba(255,255,255,0.6);\">Ley 1564 de 2012, reformada por la Ley 2445 de 2025<\/div>\n  <div style=\"position:relative; display:flex; align-items:center; gap:20px; margin-top:64px;\">\n    <div style=\"width:56px; height:2px; background: var(--atria-gold-500);\"><\/div>\n    <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size: var(--type-body); letter-spacing:0.01em;\">María José Pardo<\/div>\n  <\/div>\n  <div style=\"position:relative; font-family: var(--font-body); font-size: var(--type-small); color: rgba(255,255,255,0.6); margin-top:8px; margin-left:76px;\">Atria Abogados · @majoinsolvencia<\/div>\n<\/section>\n\n<section data-label=\"Agenda\" data-screen-label=\"02\" style=\"position:relative; width:100%; height:100%; background: var(--atria-paper); color: var(--atria-ink); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display:flex; flex-direction:column;\"><div style=\"position:absolute; top:76px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:var(--atria-steel-500); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div class=\"eyebrow\" style=\"font-size: var(--type-small); color: var(--atria-navy-700);\">Agenda<\/div>\n  <h2 style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size: var(--type-title); margin: 20px 0 var(--gap-title); color: var(--atria-navy-900); max-width:1550px;\">Hoja de ruta de la conferencia<\/h2>\n  <div style=\"display:grid; grid-template-columns: repeat(2, 1fr); gap: 28px 64px; flex:1;\">\n    <div style=\"display:flex; gap:24px; align-items:flex-start;\">\n      <div style=\"font-family: var(--font-display); font-weight:700; font-size:44px; color: var(--atria-navy-300); min-width:64px;\">01<\/div>\n      <div><div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size: var(--type-body); color: var(--atria-navy-900);\">Qué es el leasing y su naturaleza<\/div><div style=\"font-family: var(--font-body); font-size: var(--type-small); color: var(--fg-2); margin-top:6px;\">Definición, opción de compra, propiedad del bien<\/div><\/div>\n    <\/div>\n    <div style=\"display:flex; gap:24px; align-items:flex-start;\">\n      <div style=\"font-family: var(--font-display); font-weight:700; font-size:44px; color: var(--atria-navy-300); min-width:64px;\">02<\/div>\n      <div><div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size: var(--type-body); color: var(--atria-navy-900);\">Tratamiento contable y tributario<\/div><div style=\"font-family: var(--font-body); font-size: var(--type-small); color: var(--fg-2); margin-top:6px;\">Cómo se registra en cabeza de cada parte<\/div><\/div>\n    <\/div>\n    <div style=\"display:flex; gap:24px; align-items:flex-start;\">\n      <div style=\"font-family: var(--font-display); font-weight:700; font-size:44px; color: var(--atria-navy-300); min-width:64px;\">03<\/div>\n      <div><div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size: var(--type-body); color: var(--atria-navy-900);\">Cómo se declara: activo, pasivo o ambos<\/div><div style=\"font-family: var(--font-body); font-size: var(--type-small); color: var(--fg-2); margin-top:6px;\">Embargabilidad de la opción de compra<\/div><\/div>\n    <\/div>\n    <div style=\"display:flex; gap:24px; align-items:flex-start;\">\n      <div style=\"font-family: var(--font-display); font-weight:700; font-size:44px; color: var(--atria-navy-300); min-width:64px;\">04<\/div>\n      <div><div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size: var(--type-body); color: var(--atria-navy-900);\">Protección durante la insolvencia<\/div><div style=\"font-family: var(--font-body); font-size: var(--type-small); color: var(--fg-2); margin-top:6px;\">Gastos de administración, renegociación, cross default<\/div><\/div>\n    <\/div>\n    <div style=\"display:flex; gap:24px; align-items:flex-start;\">\n      <div style=\"font-family: var(--font-display); font-weight:700; font-size:44px; color: var(--atria-navy-300); min-width:64px;\">05<\/div>\n      <div><div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size: var(--type-body); color: var(--atria-navy-900);\">Liquidación y adjudicación<\/div><div style=\"font-family: var(--font-body); font-size: var(--type-small); color: var(--fg-2); margin-top:6px;\">Qué pasa con el leasing al final del proceso<\/div><\/div>\n    <\/div>\n    <div style=\"display:flex; gap:24px; align-items:flex-start;\">\n      <div style=\"font-family: var(--font-display); font-weight:700; font-size:44px; color: var(--atria-navy-300); min-width:64px;\">06<\/div>\n      <div><div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size: var(--type-body); color: var(--atria-navy-900);\">Cinco reglas prácticas<\/div><div style=\"font-family: var(--font-body); font-size: var(--type-small); color: var(--fg-2); margin-top:6px;\">Cierre operativo para el manejo de casos<\/div><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer-row\">\n    <div style=\"font-family: var(--font-body); font-size: var(--type-micro); color: var(--fg-3);\">Ley 1564 de 2012 · Ley 2445 de 2025<\/div>\n  <\/div>\n<\/section>\n\n\n<section data-label=\"Introducción\" data-screen-label=\"03\" style=\"position:relative; width:100%; height:100%; background: var(--atria-paper); color: var(--atria-ink); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display:flex; flex-direction:column; overflow:hidden;\"><div style=\"position:absolute; top:76px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:var(--atria-steel-500); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div style=\"position:absolute; inset:0;\"><img src=\"img-02-hoja-de-ruta-de-la-conferencia-fondo.jpg\" alt=\"\" style=\"width:100%; height:100%; object-fit:cover; opacity:0.34;\"><div style=\"position:absolute; inset:0; background: linear-gradient(180deg, rgba(247,248,250,0.4) 0%, rgba(247,248,250,0.88) 100%);\"><\/div><\/div>\n  <div class=\"eyebrow\" style=\"position:relative; font-size: var(--type-small); color: var(--atria-navy-700);\">Introducción<\/div>\n  <h2 style=\"position:relative; z-index:1; font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size: var(--type-title); margin: 20px 0 var(--gap-title); color: var(--atria-navy-900); max-width:1500px;\">El momento en que aparece el leasing<\/h2>\n  <div style=\"position:relative; z-index:1; display:grid; grid-template-columns: 1.1fr 0.9fr; gap:64px; flex:1; align-items:flex-start;\">\n    <div>\n      <div class=\"atria-sub-italic\" style=\"font-size: var(--type-body); color: var(--fg-1); line-height:1.5;\">—¿Tiene deudas? —las cuenta todas. —¿Tiene bienes? —“No, no tengo nada.” Y luego, casi de pasada: —“Ah, y tengo un leasing.”<\/div>\n      <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); margin-top:32px; line-height:1.5;\">Ahí empieza la incertidumbre: no se sabe si se declara como <span style=\"color:var(--atria-navy-700); font-weight:600;\">bien<\/span>, como <span style=\"color:var(--atria-red-500); font-weight:600;\">deuda<\/span>, o como ambas cosas a la vez.<\/div>\n      <div style=\"font-family: var(--font-body); font-size: 24px; color: var(--fg-2); margin-top:20px; line-height:1.45;\">No es un detalle menor: es la pieza que más dudas genera y más discusiones ha producido en los despachos judiciales. Hoy recorremos, paso a paso, qué es el leasing, cómo se declara, cómo se protege y qué ocurre con él en la liquidación y en la adjudicación final.<\/div>\n    <\/div>\n    <div style=\"background:#fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding:40px 44px;\">\n      <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size: var(--type-small); color: var(--atria-navy-900); margin-bottom:22px;\">Preguntas que resolveremos<\/div>\n      <div style=\"display:flex; flex-direction:column; gap:16px; font-family: var(--font-body); font-size: 26px; color: var(--fg-1);\">\n        <div>¿Es embargable?<\/div>\n        <div>¿Se puede terminar?<\/div>\n        <div>¿Se puede ceder?<\/div>\n        <div>¿Qué pasa si no se ejerce la opción de compra?<\/div>\n        <div>¿Qué pasa si llega a la adjudicación sin resolverse?<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer-row\">\n    <div style=\"font-family: var(--font-body); font-size: var(--type-micro); color: var(--fg-3);\"><\/div>\n  <\/div>\n<\/section>\n\n<section data-label=\"Qué es el leasing\" data-screen-label=\"04\" style=\"position:relative; width:100%; height:100%; background: var(--grad-radial-navy); color:#fff; padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display:flex; flex-direction:column; overflow:hidden;\"><div style=\"position:absolute; top:76px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:rgba(255,255,255,0.75); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div style=\"position:absolute; inset:0;\"><img src=\"img-03-el-momento-en-que-aparece-el-leasing-fondo.jpg\" alt=\"\" style=\"width:100%; height:100%; object-fit:cover; opacity:0.4;\"><div style=\"position:absolute; inset:0; background: linear-gradient(180deg, rgba(0,49,115,0.4) 0%, rgba(0,26,63,0.8) 100%);\"><\/div><\/div>\n  <div style=\"position:absolute; inset:48px; border:1.5px solid rgba(255,255,255,0.18); border-radius:28px; pointer-events:none;\"><\/div>\n  <div class=\"eyebrow\" style=\"position:relative; font-size: var(--type-small); color: var(--atria-navy-300);\">Fundamentos del leasing<\/div>\n  <h2 style=\"position:relative; font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size: var(--type-title); margin: 20px 0 var(--gap-title);\">¿Qué es el leasing?<\/h2>\n  <div style=\"position:relative; display:grid; grid-template-columns: 1fr 1fr; gap:56px; flex:1;\">\n    <div>\n      <div style=\"font-family: var(--font-body); font-size: var(--type-body); line-height:1.5; color: rgba(255,255,255,0.9);\">Contrato financiero <span style=\"color: var(--atria-gold-300, #D2B181); font-weight:600;\">principal, bilateral, consensuado, oneroso, conmutativo, de tracto sucesivo<\/span> y de naturaleza mercantil.<\/div>\n      <div style=\"font-family: var(--font-body); font-size: var(--type-small); line-height:1.5; color: rgba(255,255,255,0.72); margin-top:28px;\">La compañía arrendadora entrega en arrendamiento un bien, financiando su uso a cambio de cánones periódicos, con una opción de compra al final del plazo.<\/div>\n      <div class=\"atria-sub-italic\" style=\"font-size:24px; line-height:1.5; color: rgba(255,255,255,0.85); margin-top:26px;\">“El propietario de un bien de capital cede su uso por un tiempo determinado, a cambio de una renta periódica, pudiendo acordar eventualmente con el usuario del bien una opción de compra.”<\/div>\n    <\/div>\n    <div style=\"display:flex; flex-direction:column; gap:20px;\">\n      <div style=\"background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius: var(--radius-md); padding:26px 30px;\">\n        <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size: var(--type-small); color: var(--atria-navy-300);\">Propiedad del bien<\/div>\n        <div style=\"font-family: var(--font-body); font-size:24px; margin-top:8px; color: rgba(255,255,255,0.85);\">Es de la compañía arrendadora hasta que se ejerza la opción de compra.<\/div>\n      <\/div>\n      <div style=\"background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius: var(--radius-md); padding:26px 30px;\">\n        <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size: var(--type-small); color: var(--atria-navy-300);\">Amortización<\/div>\n        <div style=\"font-family: var(--font-body); font-size:24px; margin-top:8px; color: rgba(255,255,255,0.85);\">El costo del activo se amortiza durante el contrato, generando utilidad para el arrendador.<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer-row\" style=\"position:relative;\">\n    <div class=\"cite\" style=\"font-size: var(--type-micro); color: rgba(255,255,255,0.55);\">Decreto 2555 de 2010, art. 2.2.1.1.1<\/div>\n  <\/div>\n<\/section>\n\n<section data-label=\"Opción de compra\" data-screen-label=\"05\" style=\"position:relative; width:100%; height:100%; background: var(--atria-paper); color: var(--atria-ink); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display:flex; flex-direction:column; overflow:hidden;\"><div style=\"position:absolute; top:76px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:var(--atria-steel-500); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div style=\"position:absolute; inset:0;\"><img src=\"img-04-que-es-el-leasing-fondo.jpg\" alt=\"\" style=\"width:100%; height:100%; object-fit:cover; opacity:0.34;\"><div style=\"position:absolute; inset:0; background: linear-gradient(180deg, rgba(247,248,250,0.4) 0%, rgba(247,248,250,0.88) 100%);\"><\/div><\/div>\n  <div class=\"eyebrow\" style=\"position:relative; font-size: var(--type-small); color: var(--atria-navy-700);\">Fundamentos del leasing<\/div>\n  <h2 style=\"position:relative; z-index:1; font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size: var(--type-title); margin: 20px 0 var(--gap-title); color: var(--atria-navy-900);\">La opción de compra<\/h2>\n  <div style=\"position:relative; z-index:1; display:grid; grid-template-columns: 1fr 1fr; gap:64px; flex:1; align-items:flex-start;\">\n    <div style=\"display:flex; flex-direction:column; gap:24px;\">\n      <div style=\"display:flex; gap:18px; align-items:flex-start;\">\n        <div style=\"width:10px; height:10px; border-radius:50%; background: var(--atria-navy-900); margin-top:12px; flex:none;\"><\/div>\n        <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.4;\">Facultad contractual del arrendatario para adquirir el bien al final del plazo, pagando un valor residual pactado.<\/div>\n      <\/div>\n      <div style=\"display:flex; gap:18px; align-items:flex-start;\">\n        <div style=\"width:10px; height:10px; border-radius:50%; background: var(--atria-navy-900); margin-top:12px; flex:none;\"><\/div>\n        <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.4;\">Es potestativa del arrendatario — no una obligación del arrendador de transferir por iniciativa propia.<\/div>\n      <\/div>\n      <div style=\"display:flex; gap:18px; align-items:flex-start;\">\n        <div style=\"width:10px; height:10px; border-radius:50%; background: var(--atria-navy-900); margin-top:12px; flex:none;\"><\/div>\n        <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.4;\">Es un derecho condicionado: el dominio solo se perfecciona al cumplirse las condiciones pactadas.<\/div>\n      <\/div>\n    <\/div>\n    <div style=\"background: var(--atria-navy-900); border-radius: var(--radius-lg); padding:44px 48px; color:#fff; box-shadow: var(--shadow-lg);\">\n      <div style=\"font-family: var(--font-display); text-transform:uppercase; font-size: var(--type-small); letter-spacing:0.06em; color: var(--atria-navy-300); margin-bottom:18px;\">Francisco González Castillo<\/div>\n      <div class=\"atria-sub-italic\" style=\"font-size: 30px; line-height:1.45; color: #fff;\">“La opción se paga durante toda la vida del contrato — es más un derecho de adquisición que un valor residual.”<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer-row\">\n    <div style=\"font-family: var(--font-body); font-size: var(--type-micro); color: var(--fg-3);\"><\/div>\n  <\/div>\n<\/section>\n\n<section data-label=\"Derecho de dominio\" data-screen-label=\"06\" style=\"position:relative; width:100%; height:100%; background: var(--atria-paper); color: var(--atria-ink); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display:flex; flex-direction:column; overflow:hidden;\"><div style=\"position:absolute; top:76px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:var(--atria-steel-500); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div style=\"position:absolute; inset:0;\"><img src=\"img-05-la-opcion-de-compra-fondo.jpg\" alt=\"\" style=\"width:100%; height:100%; object-fit:cover; opacity:0.34;\"><div style=\"position:absolute; inset:0; background: linear-gradient(180deg, rgba(247,248,250,0.4) 0%, rgba(247,248,250,0.88) 100%);\"><\/div><\/div>\n  <div class=\"eyebrow\" style=\"position:relative; font-size: var(--type-small); color: var(--atria-navy-700);\">Fundamentos del leasing<\/div>\n  <h2 style=\"position:relative; z-index:1; font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size: var(--type-title); margin: 20px 0 var(--gap-title); color: var(--atria-navy-900); max-width:1400px;\">El derecho de dominio o propiedad<\/h2>\n  <div style=\"position:relative; z-index:1; display:flex; flex-direction:column; gap: var(--gap-item); flex:1;\">\n    <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.45; max-width:1500px;\">El bien inmueble en leasing habitacional es propiedad de la entidad autorizada hasta la tradición <span class=\"cite\" style=\"color:var(--fg-3); font-size:24px;\">(Decreto 2555 de 2010, art. 2.28.1.3.1)<\/span>.<\/div>\n    <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.45; max-width:1500px;\">El leasing financiero es un contrato de financiación con fines de garantía — se le aplica la <span style=\"color:var(--atria-navy-700); font-weight:600;\">Ley 1676 de 2013<\/span>.<\/div>\n    <div style=\"background:#fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding:32px 40px; border-left: 6px solid var(--atria-navy-900); max-width:1500px;\">\n      <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.45;\">El bien objeto de leasing hace parte del patrimonio objeto de insolvencia del locatario, como derecho de dominio sujeto a <span style=\"color: var(--atria-red-500); font-weight:600;\">condición suspensiva<\/span>.<\/div>\n    <\/div>\n    <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.45; max-width:1500px;\">Hasta que no se ejerza la opción y se haga tradición del bien, el locatario solo tiene una <span style=\"color: var(--atria-red-500); font-weight:600;\">mera expectativa<\/span>.<\/div>\n    <div style=\"background: var(--atria-navy-900); border-radius: var(--radius-lg); padding:30px 36px; max-width:1600px;\">\n      <div class=\"atria-sub-italic\" style=\"font-size:24px; line-height:1.5; color:#fff;\">“Es un derecho de dominio sujeto a una condición suspensiva; condición que sería el pago total de las cuotas, así como el ejercicio de la opción de compra.”<\/div>\n    <\/div>\n    <div style=\"background:#fff; border: 2px solid var(--atria-navy-100); border-radius: var(--radius-lg); padding:30px 36px; max-width:1600px;\">\n      <div class=\"atria-sub-italic\" style=\"font-size:24px; line-height:1.5; color: var(--fg-1);\">“Puede afirmarse que hasta tanto se manifieste por los medios idóneos y dentro de la oportunidad debida el asentimiento de ejercer la opción de compra, el locatario no tiene más que una mera expectativa de hacerse dueño de la cosa, y el derecho de dominio radica en cabeza de la compañía de leasing.”<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer-row\">\n    <div class=\"cite\" style=\"font-size: var(--type-micro); color: var(--fg-3); max-width:1100px;\">semillerocontratos.uniandes.edu.co · Oficio Supersociedades 220-33566<\/div>\n  <\/div>\n<\/section>\n\n<section data-label=\"Tratamiento contable\" data-screen-label=\"07\" style=\"position:relative; width:100%; height:100%; background:#111827; color:#fff; padding: 68px var(--pad-x) 60px; display:flex; flex-direction:column;\"><div style=\"position:absolute; top:76px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:rgba(255,255,255,0.75); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div class=\"eyebrow\" style=\"font-size: var(--type-small); color: var(--atria-navy-300);\">Fundamentos del leasing<\/div>\n  <h2 style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size: 52px; margin: 16px 0 32px;\">Tratamiento contable y tributario<\/h2>\n  <div style=\"font-family: var(--font-body); font-size: 24px; color: rgba(255,255,255,0.85); max-width: 1750px; margin-bottom:22px; line-height:1.4;\">El artículo 127-1 del Estatuto Tributario define cinco indicios para identificar el leasing financiero — basta con que se cumpla uno. La DIAN puede evaluar la esencia económica del contrato para reclasificarlo. <span style=\"color: var(--atria-navy-300); font-weight:600;\">Arrendador:<\/span> reconoce un activo financiero (no el bien físico) y solo declara como ingreso los rendimientos que este genera — trata la operación como un préstamo, no un arriendo. <span style=\"color: var(--atria-navy-300); font-weight:600;\">Arrendatario:<\/span> registra desde el inicio activo y pasivo por igual valor; el abono a capital no es deducible, los intereses sí (art. 118-1 ET).<\/div>\n  <div style=\"display:grid; grid-template-columns: 1fr 1fr; gap:40px; flex:1; min-height:0;\">\n    <img src=\"img-06-ejemplo-practico-leasing-financiero-de-m.png\" alt=\"Ejemplo práctico: leasing financiero de maquinaria industrial\" style=\"width:100%; height:100%; object-fit:contain; border-radius: var(--radius-md); background:#0d1117;\">\n    <img src=\"img-07-ano-1-el-momento-de-la-firma.png\" alt=\"Año 1 — el momento de la firma\" style=\"width:100%; height:100%; object-fit:contain; border-radius: var(--radius-md); background:#0d1117;\">\n  <\/div>\n  <div class=\"footer-row\" style=\"position:relative;\">\n    <div class=\"cite\" style=\"font-size: var(--type-micro); color: rgba(255,255,255,0.5);\">Estatuto Tributario, arts. 127-1 y 118-1<\/div>\n  <\/div>\n<\/section>\n\n<section data-label=\"Derecho del locatario\" data-screen-label=\"08\" style=\"position:relative; width:100%; height:100%; background: var(--atria-paper); color: var(--atria-ink); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display:flex; flex-direction:column; overflow:hidden;\"><div style=\"position:absolute; top:76px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:var(--atria-steel-500); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div style=\"position:absolute; inset:0;\"><img src=\"img-08-tratamiento-contable-y-tributario-fondo.jpg\" alt=\"\" style=\"width:100%; height:100%; object-fit:cover; opacity:0.34;\"><div style=\"position:absolute; inset:0; background: linear-gradient(180deg, rgba(247,248,250,0.4) 0%, rgba(247,248,250,0.88) 100%);\"><\/div><\/div>\n  <div class=\"eyebrow\" style=\"position:relative; font-size: var(--type-small); color: var(--atria-navy-700);\">Cómo se declara<\/div>\n  <h2 style=\"position:relative; z-index:1; font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size: var(--type-title); margin: 20px 0 var(--gap-title); color: var(--atria-navy-900); max-width:1500px;\">Existe un derecho del locatario en el contrato<\/h2>\n  <div style=\"position:relative; z-index:1; display:flex; flex-direction:column; gap: var(--gap-item); flex:1;\">\n    <div style=\"display:flex; gap:24px; align-items:flex-start;\">\n      <div style=\"font-family: var(--font-display); font-weight:700; color: var(--atria-navy-300); font-size:34px; min-width:100px;\">CGP 539.4<\/div>\n      <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.4;\">Obligación de relacionar completa y detalladamente los bienes del deudor, incluidos gravámenes y afectaciones.<\/div>\n    <\/div>\n    <div style=\"display:flex; gap:24px; align-items:flex-start;\">\n      <div style=\"font-family: var(--font-display); font-weight:700; color: var(--atria-navy-300); font-size:34px; min-width:100px;\">CGP 565<\/div>\n      <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.4;\">Efectos de la apertura de la liquidación patrimonial: integración de la masa de activos del deudor.<\/div>\n    <\/div>\n    <div style=\"background:#fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding:32px 40px; margin-top:8px;\">\n      <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size: var(--type-small); color: var(--atria-red-500); margin-bottom:10px;\">No entran a la masa<\/div>\n      <div style=\"font-family: var(--font-body); font-size: 26px; color: var(--fg-1); line-height:1.4;\">Los bienes del cónyuge, los de patrimonio de familia inembargable, ni los inembargables por ley.<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer-row\">\n    <div class=\"cite\" style=\"font-size: var(--type-micro); color: var(--fg-3);\">CGP, arts. 539 y 565<\/div>\n  <\/div>\n<\/section>\n\n\n<section data-label=\"Postura afirmativa\" data-screen-label=\"09\" style=\"position:relative; width:100%; height:100%; background: var(--grad-radial-navy); color:#fff; padding: 64px var(--pad-x) 60px; display:flex; flex-direction:column;\"><div style=\"position:absolute; top:76px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:rgba(255,255,255,0.75); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div style=\"position:absolute; inset:48px; border:1.5px solid rgba(255,255,255,0.18); border-radius:28px; pointer-events:none;\"><\/div>\n  <div style=\"position:relative; display:flex; align-items:center; gap:16px;\">\n    <div class=\"eyebrow\" style=\"font-size: var(--type-small); color: var(--atria-navy-300);\">Embargabilidad<\/div>\n    <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size:24px; letter-spacing:0.08em; background: rgba(148,190,230,0.2); color:#fff; padding:6px 16px; border-radius:9999px;\">Postura afirmativa<\/div>\n  <\/div>\n  <h2 style=\"position:relative; font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size: 52px; margin: 16px 0 26px; max-width:1500px;\">Sí es embargable el derecho del locatario<\/h2>\n  <div style=\"position:relative; display:grid; grid-template-columns: 0.85fr 1fr; gap:44px; flex:1; min-height:0;\">\n    <div style=\"display:flex; flex-direction:column; gap:18px; overflow:hidden;\">\n      <div style=\"font-family: var(--font-body); font-size:24px; color: rgba(255,255,255,0.9); line-height:1.4;\">La opción de compra es un <span style=\"color: var(--atria-gold-300, #D2B181); font-weight:600;\">bien incorporal<\/span> que integra el patrimonio del locatario y es embargable.<\/div>\n      <div style=\"font-family: var(--font-body); font-size:24px; color: rgba(255,255,255,0.65); line-height:1.4;\">Juzgado 1º Civil del Circuito de San Andrés, rad. 88-001-31-03-001-2021-00046-00<\/div>\n      <div style=\"font-family: var(--font-body); font-size:24px; color: rgba(255,255,255,0.9); line-height:1.4; margin-top:10px;\">El derecho a ejercer la opción de compra es susceptible de <span style=\"color: var(--atria-gold-300, #D2B181); font-weight:600;\">embargo y secuestro<\/span>.<\/div>\n      <div style=\"font-family: var(--font-body); font-size:24px; color: rgba(255,255,255,0.65); line-height:1.4;\">Tribunal Superior de Buga, Sala Civil Familia, rad. 76-147-31-03-001-2024-00030-01<\/div>\n      <div style=\"font-family: var(--font-body); font-size:24px; color: rgba(255,255,255,0.85); line-height:1.4; margin-top:10px;\">El patrimonio es una universalidad jurídica que incluye derechos incorporales, no solo bienes materiales. El Decreto 2555/2010, art. 2.28.1.2.1 lit. g, permite ceder el derecho de opción — confirma que está en el comercio.<\/div>\n    <\/div>\n    <img src=\"img-09-esquema-del-mecanismo-de-embargo-de-la-o.png\" alt=\"Esquema del mecanismo de embargo de la opción de compra\" style=\"width:100%; height:100%; object-fit:contain; border-radius: var(--radius-md);\">\n  <\/div>\n  <div class=\"footer-row\" style=\"position:relative;\">\n    <div class=\"cite\" style=\"font-size: var(--type-micro); color: rgba(255,255,255,0.5);\">Juzgado 1º Civil San Andrés · T.S. Buga, Sala Civil Familia<\/div>\n  <\/div>\n<\/section>\n\n<section data-label=\"Postura negativa\" data-screen-label=\"10\" style=\"position:relative; width:100%; height:100%; background: var(--grad-radial-red); color:#fff; padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display:flex; flex-direction:column; overflow:hidden;\"><div style=\"position:absolute; top:76px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:rgba(255,255,255,0.75); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div style=\"position:absolute; inset:0;\"><img src=\"img-10-si-es-embargable-el-derecho-del-locatari-fondo.jpg\" alt=\"\" style=\"width:100%; height:100%; object-fit:cover; opacity:0.4;\"><div style=\"position:absolute; inset:0; background: linear-gradient(180deg, rgba(168,37,22,0.4) 0%, rgba(179,34,26,0.8) 100%);\"><\/div><\/div>\n  <div style=\"position:absolute; inset:48px; border:1.5px solid rgba(255,255,255,0.18); border-radius:28px; pointer-events:none;\"><\/div>\n  <div style=\"position:relative; display:flex; align-items:center; gap:16px;\">\n    <div class=\"eyebrow\" style=\"font-size: var(--type-small); color: rgba(255,255,255,0.75);\">Embargabilidad<\/div>\n    <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size:24px; letter-spacing:0.08em; background: rgba(255,255,255,0.2); color:#fff; padding:6px 16px; border-radius:9999px;\">Postura negativa<\/div>\n  <\/div>\n  <h2 style=\"position:relative; font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size: var(--type-title); margin: 20px 0 var(--gap-title); max-width:1500px;\">No es embargable: una mera expectativa<\/h2>\n  <div style=\"position:relative; display:flex; flex-direction:column; gap: var(--gap-item); flex:1;\">\n    <div style=\"display:flex; gap:24px; align-items:flex-start;\">\n      <div style=\"width:10px; height:10px; border-radius:50%; background:#fff; margin-top:14px; flex:none;\"><\/div>\n      <div style=\"font-family: var(--font-body); font-size: var(--type-body); line-height:1.4;\">La opción de compra es una mera expectativa, no un derecho consolidado. <span style=\"font-size:24px; opacity:0.7;\">— Juzgado 3º Civil del Circuito de Buga, Auto 185 del 22 feb. 2024<\/span><\/div>\n    <\/div>\n    <div style=\"display:flex; gap:24px; align-items:flex-start;\">\n      <div style=\"width:10px; height:10px; border-radius:50%; background:#fff; margin-top:14px; flex:none;\"><\/div>\n      <div style=\"font-family: var(--font-body); font-size: var(--type-body); line-height:1.4;\">No es posible embargar derechos inciertos sujetos a condición. <span style=\"font-size:24px; opacity:0.7;\">— T.S. Distrito Judicial de Cali, rad. 016-2019-00109-01<\/span><\/div>\n    <\/div>\n    <div style=\"display:flex; gap:24px; align-items:flex-start;\">\n      <div style=\"width:10px; height:10px; border-radius:50%; background:#fff; margin-top:14px; flex:none;\"><\/div>\n      <div style=\"font-family: var(--font-body); font-size: var(--type-body); line-height:1.4;\">El dominio del bien permanece en el arrendador hasta que se ejerza la opción y se perfeccione la transferencia.<\/div>\n    <\/div>\n    <div style=\"background: rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); border-radius: var(--radius-lg); padding:28px 36px; margin-top:8px;\">\n      <div style=\"font-family: var(--font-body); font-size: 26px; line-height:1.4;\">Las medidas cautelares deben recaer sobre bienes que integren <b>actualmente<\/b> el patrimonio del ejecutado, no sobre expectativas futuras.<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer-row\" style=\"position:relative;\">\n    <div class=\"cite\" style=\"font-size: var(--type-micro); color: rgba(255,255,255,0.6);\">Juzgado 3º Civil Buga, Auto 185/2024 · T.S. Cali, rad. 016-2019-00109-01<\/div>\n  <\/div>\n<\/section>\n\n<section data-label=\"Condiciones\" data-screen-label=\"11\" style=\"position:relative; width:100%; height:100%; background: var(--atria-paper); color: var(--atria-ink); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display:flex; flex-direction:column; overflow:hidden;\"><div style=\"position:absolute; top:76px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:var(--atria-steel-500); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div style=\"position:absolute; inset:0;\"><img src=\"img-11-no-es-embargable-una-mera-expectativa-fondo.jpg\" alt=\"\" style=\"width:100%; height:100%; object-fit:cover; opacity:0.34;\"><div style=\"position:absolute; inset:0; background: linear-gradient(180deg, rgba(247,248,250,0.4) 0%, rgba(247,248,250,0.88) 100%);\"><\/div><\/div>\n  <div class=\"eyebrow\" style=\"position:relative; font-size: var(--type-small); color: var(--atria-navy-700);\">Embargabilidad<\/div>\n  <h2 style=\"position:relative; z-index:1; font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size: var(--type-title); margin: 20px 0 var(--gap-title); color: var(--atria-navy-900); max-width:1500px;\">Condiciones de embargabilidad e inembargabilidad<\/h2>\n  <div style=\"position:relative; z-index:1; display:grid; grid-template-columns: 1fr 1fr; gap:36px; flex:1;\">\n    <div style=\"background:#fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding:34px 38px; border-top: 6px solid var(--atria-navy-900);\">\n      <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size: var(--type-body); color: var(--atria-navy-900); margin-bottom:20px;\">Razones para embargar<\/div>\n      <div style=\"display:flex; flex-direction:column; gap:14px; font-family: var(--font-body); font-size:23px; color: var(--fg-1); line-height:1.3;\">\n        <div>Derecho incorporal patrimonializable<\/div>\n        <div>No se embarga la propiedad, sino el derecho a adquirirla<\/div>\n        <div>Es transmisible<\/div>\n        <div>Cumple los requisitos procesales del embargo<\/div>\n        <div>Útil para el acreedor: puede decidir sobre la opción al final del contrato<\/div>\n      <\/div>\n    <\/div>\n    <div style=\"background:#fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding:34px 38px; border-top: 6px solid var(--atria-red-500);\">\n      <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size: var(--type-body); color: var(--atria-red-500); margin-bottom:20px;\">Razones para no embargar<\/div>\n      <div style=\"display:flex; flex-direction:column; gap:14px; font-family: var(--font-body); font-size:23px; color: var(--fg-1); line-height:1.3;\">\n        <div>El bien no está en el patrimonio del deudor<\/div>\n        <div>Es una mera expectativa, no un derecho consolidado<\/div>\n        <div>Las cautelares deben recaer sobre bienes actuales, no futuros<\/div>\n        <div>No es un derecho de crédito en sentido estricto<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div style=\"position:relative; z-index:1; background: var(--atria-steel-100); border-radius: var(--radius-md); padding:24px 36px; margin-top:28px;\">\n    <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size:24px; color: var(--fg-2); margin-bottom:8px;\">Obstáculos prácticos al remate<\/div>\n    <div style=\"font-family: var(--font-body); font-size:24px; color: var(--fg-1);\">Cláusula de intransferibilidad · consentimiento del arrendador · condiciones futuras inciertas<\/div>\n  <\/div>\n  <div class=\"footer-row\">\n    <div style=\"font-family: var(--font-body); font-size: var(--type-micro); color: var(--fg-3);\"><\/div>\n  <\/div>\n<\/section>\n\n<section data-label=\"Leasing como pasivo\" data-screen-label=\"12\" style=\"position:relative; width:100%; height:100%; background: var(--atria-paper); color: var(--atria-ink); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display:flex; flex-direction:column; overflow:hidden;\"><div style=\"position:absolute; top:76px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:var(--atria-steel-500); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div style=\"position:absolute; inset:0;\"><img src=\"img-12-condiciones-de-embargabilidad-e-inembarg-fondo.jpg\" alt=\"\" style=\"width:100%; height:100%; object-fit:cover; opacity:0.34;\"><div style=\"position:absolute; inset:0; background: linear-gradient(180deg, rgba(247,248,250,0.4) 0%, rgba(247,248,250,0.88) 100%);\"><\/div><\/div>\n  <div class=\"eyebrow\" style=\"position:relative; font-size: var(--type-small); color: var(--atria-navy-700);\">Cómo se declara<\/div>\n  <h2 style=\"position:relative; z-index:1; font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size: var(--type-title); margin: 20px 0 var(--gap-title); color: var(--atria-navy-900); max-width:1500px;\">El leasing como pasivo en la insolvencia<\/h2>\n  <div style=\"position:relative; z-index:1; display:flex; flex-direction:column; gap: var(--gap-item); flex:1;\">\n    <div style=\"display:flex; gap:24px; align-items:flex-start;\">\n      <div style=\"font-family: var(--font-display); font-weight:700; color: var(--atria-navy-300); font-size:34px; min-width:120px;\">CGP 539.3<\/div>\n      <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.4;\">Relación completa y actualizada de todos los acreedores, en el orden de prelación del Código Civil.<\/div>\n    <\/div>\n    <div style=\"background:#fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding:32px 40px;\">\n      <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.4;\">Debe indicarse capital e intereses, incluidos los cánones vencidos de los contratos de leasing — <span class=\"atria-sub-italic\" style=\"font-size:26px; color: var(--atria-navy-700); font-weight:600;\">“aún en los cánones vencidos de los contratos de leasing”<\/span>.<\/div>\n    <\/div>\n    <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.4; max-width:1500px;\">Debe precisarse naturaleza del crédito, tasas de interés, documentos, fechas y codeudores o avalistas.<\/div>\n  <\/div>\n  <div class=\"footer-row\">\n    <div class=\"cite\" style=\"font-size: var(--type-micro); color: var(--fg-3);\">CGP, art. 539 num. 3<\/div>\n  <\/div>\n<\/section>\n\n<section data-label=\"Apertura liquidación\" data-screen-label=\"13\" style=\"position:relative; width:100%; height:100%; background:#fff; color: var(--atria-ink); padding: 68px var(--pad-x) 56px; display:flex; flex-direction:column;\"><div style=\"position:absolute; top:76px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:var(--atria-steel-500); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div class=\"eyebrow\" style=\"font-size: var(--type-small); color: var(--atria-navy-700);\">Liquidación y adjudicación<\/div>\n  <h2 style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size: 52px; margin: 16px 0 30px; color: var(--atria-navy-900); max-width:1600px;\">La apertura de la liquidación y la ruptura patrimonial<\/h2>\n  <div style=\"display:grid; grid-template-columns: repeat(4, 1fr); gap:20px; margin-bottom:36px;\">\n    <div style=\"background: var(--atria-paper); border-radius: var(--radius-md); padding:22px 24px;\"><div style=\"font-family: var(--font-display); font-weight:700; color: var(--atria-navy-300); font-size:24px;\">565.2<\/div><div style=\"font-family: var(--font-body); font-size:24px; color: var(--fg-1); margin-top:8px; line-height:1.3;\">Los bienes a la apertura solo responden por obligaciones anteriores a esa fecha.<\/div><\/div>\n    <div style=\"background: var(--atria-paper); border-radius: var(--radius-md); padding:22px 24px;\"><div style=\"font-family: var(--font-display); font-weight:700; color: var(--atria-navy-300); font-size:24px;\">565.3<\/div><div style=\"font-family: var(--font-body); font-size:24px; color: var(--fg-1); margin-top:8px; line-height:1.3;\">Incorporación de todas las obligaciones nacidas antes de la providencia de apertura.<\/div><\/div>\n    <div style=\"background: var(--atria-paper); border-radius: var(--radius-md); padding:22px 24px;\"><div style=\"font-family: var(--font-display); font-weight:700; color: var(--atria-navy-300); font-size:24px;\">565.4<\/div><div style=\"font-family: var(--font-body); font-size:24px; color: var(--fg-1); margin-top:8px; line-height:1.3;\">Integración de la masa de activos del deudor al momento de la apertura.<\/div><\/div>\n    <div style=\"background: var(--atria-paper); border-radius: var(--radius-md); padding:22px 24px;\"><div style=\"font-family: var(--font-display); font-weight:700; color: var(--atria-navy-300); font-size:24px;\">566 par. 2<\/div><div style=\"font-family: var(--font-body); font-size:24px; color: var(--fg-1); margin-top:8px; line-height:1.3;\">Obligaciones posteriores pueden demandarse ejecutivamente, incluidas las que afecten bienes adjudicados.<\/div><\/div>\n  <\/div>\n  <div style=\"flex:1; display:flex; align-items:center; min-height:0;\">\n    <img src=\"img-13-linea-de-tiempo-del-proceso-de-insolvenc.png\" alt=\"Línea de tiempo del proceso de insolvencia\" style=\"width:100%; max-height:100%; object-fit:contain;\">\n  <\/div>\n  <div class=\"footer-row\" style=\"position:relative;\">\n    <div class=\"cite\" style=\"font-size: var(--type-micro); color: var(--fg-3);\">CGP, arts. 565 y 566<\/div>\n  <\/div>\n<\/section>\n\n<section data-label=\"Gastos de administración\" data-screen-label=\"14\" style=\"position:relative; width:100%; height:100%; background: var(--atria-paper); color: var(--atria-ink); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display:flex; flex-direction:column;\"><div style=\"position:absolute; top:76px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:var(--atria-steel-500); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div class=\"eyebrow\" style=\"font-size: var(--type-small); color: var(--atria-navy-700);\">Protección durante la insolvencia<\/div>\n  <h2 style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size: var(--type-title); margin: 20px 0 var(--gap-title); color: var(--atria-navy-900); max-width:1500px;\">Los cánones del leasing como gastos de administración<\/h2>\n  <div style=\"display:flex; flex-direction:column; gap: var(--gap-item); flex:1;\">\n    <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.45; max-width:1500px;\">Los gastos necesarios para la subsistencia del deudor deben estar al día para la aprobación del acuerdo <span class=\"cite\" style=\"color:var(--fg-3); font-size:24px;\">(CGP art. 549)<\/span>.<\/div>\n    <div style=\"background:#fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding:32px 40px; border-left: 6px solid var(--atria-red-500); max-width:1500px;\">\n      <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.45;\">El incumplimiento en el pago de gastos de administración es <span style=\"color: var(--atria-red-500); font-weight:600;\">causal de fracaso<\/span> del procedimiento de negociación de deudas.<\/div>\n    <\/div>\n    <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.45; max-width:1500px;\">Las obligaciones posteriores al inicio del proceso de insolvencia tienen <span style=\"color: var(--atria-navy-700); font-weight:600;\">preferencia de pago y cobro coactivo<\/span>.<\/div>\n  <\/div>\n  <div class=\"footer-row\">\n    <div class=\"cite\" style=\"font-size: var(--type-micro); color: var(--fg-3);\">CGP, art. 549 · Ley 1116 de 2006, art. 71<\/div>\n  <\/div>\n<\/section>\n\n<section data-label=\"Restitución de tenencia\" data-screen-label=\"15\" style=\"position:relative; width:100%; height:100%; background: var(--atria-paper); color: var(--atria-ink); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display:flex; flex-direction:column; overflow:hidden;\"><div style=\"position:absolute; top:76px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:var(--atria-steel-500); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div style=\"position:absolute; inset:0;\"><img src=\"img-14-los-canones-del-leasing-como-gastos-de-a-fondo.jpg\" alt=\"\" style=\"width:100%; height:100%; object-fit:cover; opacity:0.34;\"><div style=\"position:absolute; inset:0; background: linear-gradient(180deg, rgba(247,248,250,0.4) 0%, rgba(247,248,250,0.88) 100%);\"><\/div><\/div>\n  <div class=\"eyebrow\" style=\"position:relative; font-size: var(--type-small); color: var(--atria-navy-700);\">Liquidación y adjudicación<\/div>\n  <h2 style=\"position:relative; z-index:1; font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size: var(--type-title); margin: 20px 0 var(--gap-title); color: var(--atria-navy-900); max-width:1500px;\">La reactivación de los procesos de restitución de tenencia<\/h2>\n  <div style=\"position:relative; z-index:1; display:flex; flex-direction:column; gap: var(--gap-item); flex:1; justify-content:center; max-width:1500px;\">\n    <div style=\"background:#fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding:40px 46px; border-left: 6px solid var(--atria-navy-900);\">\n      <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.45;\">Los procesos de restitución de tenencia de bienes en leasing contra el deudor <span style=\"color: var(--atria-navy-700); font-weight:600;\">continúan su curso<\/span> <span class=\"cite\" style=\"color:var(--fg-3); font-size:24px;\">(CGP art. 565 par. 3)<\/span>.<\/div>\n    <\/div>\n    <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.45; margin-top:8px;\">Los créditos insolutos que originaron el proceso de restitución se sujetan a las reglas de la liquidación.<\/div>\n  <\/div>\n  <div class=\"footer-row\">\n    <div class=\"cite\" style=\"font-size: var(--type-micro); color: var(--fg-3);\">CGP, art. 565 par. 3<\/div>\n  <\/div>\n<\/section>\n\n<section data-label=\"Ley 2445\" data-screen-label=\"16\" style=\"position:relative; width:100%; height:100%; background: var(--grad-radial-navy); color:#fff; padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display:flex; flex-direction:column;\"><div style=\"position:absolute; top:76px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:rgba(255,255,255,0.75); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div style=\"position:absolute; inset:48px; border:1.5px solid rgba(255,255,255,0.18); border-radius:28px; pointer-events:none;\"><\/div>\n  <div class=\"eyebrow\" style=\"position:relative; font-size: var(--type-small); color: var(--atria-gold-300, #D2B181);\">Herramientas de la Ley 2445 de 2025<\/div>\n  <h2 style=\"position:relative; font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size: 50px; margin: 16px 0 30px; max-width:1600px;\">Renegociación y terminación unilateral<\/h2>\n  <div style=\"position:relative; display:grid; grid-template-columns: 1fr 1fr; gap:36px; flex:1;\">\n    <div style=\"background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius: var(--radius-md); padding:30px 34px;\">\n      <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size:24px; color: var(--atria-navy-300); margin-bottom:12px;\">Art. 545 num. 8<\/div>\n      <div style=\"font-family: var(--font-body); font-size:24px; line-height:1.4; color: rgba(255,255,255,0.9);\">El deudor admitido a insolvencia puede buscar la renegociación de mutuo acuerdo de los contratos de leasing.<\/div>\n    <\/div>\n    <div style=\"background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius: var(--radius-md); padding:30px 34px;\">\n      <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size:24px; color: var(--atria-navy-300); margin-bottom:12px;\">Si no hay acuerdo<\/div>\n      <div style=\"font-family: var(--font-body); font-size:24px; line-height:1.4; color: rgba(255,255,255,0.9);\">Cualquiera de las partes puede terminar unilateralmente, comunicando al conciliador.<\/div>\n    <\/div>\n    <div style=\"background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius: var(--radius-md); padding:30px 34px;\">\n      <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size:24px; color: var(--atria-navy-300); margin-bottom:12px;\">Si termina el deudor<\/div>\n      <div style=\"font-family: var(--font-body); font-size:24px; line-height:1.4; color: rgba(255,255,255,0.9);\">Debe acreditar tracto sucesivo en ejecución, prestaciones excesivas frente al mercado, y presentar un análisis costo-beneficio.<\/div>\n    <\/div>\n    <div style=\"background: rgba(239,58,42,0.18); border:1px solid rgba(239,58,42,0.4); border-radius: var(--radius-md); padding:30px 34px;\">\n      <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size:24px; color: #fff; margin-bottom:12px;\">Consecuencia<\/div>\n      <div style=\"font-family: var(--font-body); font-size:24px; line-height:1.4; color: rgba(255,255,255,0.9);\">Entrega inmediata del bien y sanciones contractuales o legales, decididas mediante incidente ante el juez del concurso.<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer-row\" style=\"position:relative;\">\n    <div class=\"cite\" style=\"font-size: var(--type-micro); color: rgba(255,255,255,0.5);\">Ley 2445 de 2025, art. 545 num. 8<\/div>\n  <\/div>\n<\/section>\n\n<section data-label=\"Acuerdos bilaterales\" data-screen-label=\"17\" style=\"position:relative; width:100%; height:100%; background: var(--atria-paper); color: var(--atria-ink); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display:flex; flex-direction:column;\"><div style=\"position:absolute; top:76px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:var(--atria-steel-500); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div class=\"eyebrow\" style=\"font-size: var(--type-small); color: var(--atria-navy-700);\">Protección durante la insolvencia<\/div>\n  <h2 style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size: var(--type-title); margin: 20px 0 var(--gap-title); color: var(--atria-navy-900); max-width:1500px;\">Acuerdos bilaterales sobre el crédito de leasing<\/h2>\n  <div style=\"display:flex; flex-direction:column; gap: 20px; flex:1;\">\n    <div style=\"font-family: var(--font-body); font-size: 27px; color: var(--fg-1); line-height:1.4; max-width:1600px;\">Si no se logra acuerdo con todos los acreedores, caben acuerdos bilaterales con acreedores con garantía real o leasing sobre la vivienda o un activo productivo necesario <span class=\"cite\" style=\"color:var(--fg-3); font-size:24px;\">(CGP art. 553 num. 3)<\/span>.<\/div>\n    <div style=\"display:grid; grid-template-columns: 1fr 1fr; gap:28px; margin-top:8px;\">\n      <div style=\"background:#fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding:28px 32px;\">\n        <div style=\"font-family: var(--font-body); font-size:24px; color: var(--fg-1); line-height:1.4;\">Los créditos y activos cobijados quedan <span style=\"color: var(--atria-navy-700); font-weight:600;\">excluidos de la liquidación<\/span> patrimonial.<\/div>\n      <\/div>\n      <div style=\"background:#fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding:28px 32px;\">\n        <div style=\"font-family: var(--font-body); font-size:24px; color: var(--fg-1); line-height:1.4;\">Solo pueden impugnarse por no cumplir las condiciones del numeral — si la entidad exige cubrir \"toda la cartera\" y no solo la obligación garantizada, se sale de la causal y queda expuesto a impugnación.<\/div>\n      <\/div>\n      <div style=\"background:#fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding:28px 32px; border-left: 6px solid var(--atria-red-500);\">\n        <div style=\"font-family: var(--font-body); font-size:24px; color: var(--fg-1); line-height:1.4;\">Prohibición subjetiva: no caben con cónyuge, compañero permanente o parientes hasta cuarto grado.<\/div>\n      <\/div>\n      <div style=\"background:#fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding:28px 32px;\">\n        <div style=\"font-family: var(--font-body); font-size:24px; color: var(--fg-1); line-height:1.4;\">En la liquidación, este acuerdo también procede antes de la audiencia de adjudicación <span class=\"cite\" style=\"color:var(--fg-3); font-size:24px;\">(CGP art. 569)<\/span>.<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer-row\">\n    <div class=\"cite\" style=\"font-size: var(--type-micro); color: var(--fg-3);\">CGP, arts. 553 num. 3 y 569<\/div>\n  <\/div>\n<\/section>\n\n<section data-label=\"Cross default\" data-screen-label=\"18\" style=\"position:relative; width:100%; height:100%; background: var(--grad-radial-red); color:#fff; padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display:flex; flex-direction:column;\"><div style=\"position:absolute; top:76px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:rgba(255,255,255,0.75); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div style=\"position:absolute; inset:48px; border:1.5px solid rgba(255,255,255,0.18); border-radius:28px; pointer-events:none;\"><\/div>\n  <div class=\"eyebrow\" style=\"position:relative; font-size: var(--type-small); color: rgba(255,255,255,0.75);\">Protección durante la insolvencia<\/div>\n  <h2 style=\"position:relative; font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size: var(--type-title); margin: 20px 0 var(--gap-title); max-width:1500px;\">Cláusula de “cross default” o incumplimiento cruzado<\/h2>\n  <div style=\"position:relative; display:grid; grid-template-columns: 1.1fr 0.9fr; gap:56px; flex:1;\">\n    <div>\n      <div class=\"atria-sub-italic\" style=\"font-size: 28px; line-height:1.5; color:#fff;\">El incumplimiento de una obligación distinta se considera automáticamente incumplimiento del contrato de leasing, aunque este esté al día.<\/div>\n      <div style=\"font-family: var(--font-body); font-size:24px; color: rgba(255,255,255,0.75); margin-top:26px; line-height:1.4;\">Normas aplicables: Ley 1328 de 2009, Ley 1480 de 2011, Circular 018 de 2016, Circular 039 de 2011, Circular Básica Jurídica.<\/div>\n      <div style=\"font-family: var(--font-body); font-size:24px; color: rgba(255,255,255,0.75); margin-top:16px; line-height:1.4;\">Aspectos de validez: desequilibrio injustificado, abuso de posición dominante, falta de conexidad, déficit de transparencia, vulneración de la buena fe contractual.<\/div>\n    <\/div>\n    <div style=\"background: rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.3); border-radius: var(--radius-lg); padding:36px 40px; align-self:flex-start;\">\n      <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size: var(--type-small); color: #fff; margin-bottom:14px;\">Consecuencia jurídica<\/div>\n      <div style=\"font-family: var(--font-body); font-size:24px; line-height:1.45; color: rgba(255,255,255,0.92);\">Cláusula no escrita, ineficaz de pleno derecho — reclamable ante el Defensor del Consumidor Financiero, la Superintendencia Financiera o la justicia ordinaria.<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer-row\" style=\"position:relative;\">\n    <div class=\"cite\" style=\"font-size: var(--type-micro); color: rgba(255,255,255,0.55);\">Ley 1328/2009 · Ley 1480/2011 · Circulares 018/2016 y 039/2011<\/div>\n  <\/div>\n<\/section>\n\n<section data-label=\"Adjudicación\" data-screen-label=\"19\" style=\"position:relative; width:100%; height:100%; background: var(--atria-paper); color: var(--atria-ink); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display:flex; flex-direction:column;\"><div style=\"position:absolute; top:76px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:var(--atria-steel-500); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div class=\"eyebrow\" style=\"font-size: var(--type-small); color: var(--atria-navy-700);\">Liquidación y adjudicación<\/div>\n  <h2 style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size: var(--type-title); margin: 20px 0 var(--gap-title); color: var(--atria-navy-900); max-width:1500px;\">El leasing en la adjudicación patrimonial<\/h2>\n  <div style=\"display:flex; flex-direction:column; gap: var(--gap-item); flex:1;\">\n    <div style=\"display:flex; gap:24px; align-items:flex-start;\">\n      <div style=\"width:10px; height:10px; border-radius:50%; background: var(--atria-red-500); margin-top:14px; flex:none;\"><\/div>\n      <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.4;\">Pérdida del derecho de descargue por omisiones dolosas del deudor sobre bienes, ingresos o créditos — <span class=\"atria-sub-italic\" style=\"font-size:26px; color: var(--atria-red-500); font-weight:600;\">“el deudor dolosamente omitió”<\/span>.<\/div>\n    <\/div>\n    <div style=\"display:flex; gap:24px; align-items:flex-start;\">\n      <div style=\"width:10px; height:10px; border-radius:50%; background: var(--atria-navy-900); margin-top:14px; flex:none;\"><\/div>\n      <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.4;\">La adjudicación de derechos de leasing a un acreedor distinto de la entidad financiera no es una simple transferencia de crédito — requiere <span style=\"color: var(--atria-navy-700); font-weight:600;\">autorización previa<\/span> de la entidad financiera.<\/div>\n    <\/div>\n    <div style=\"display:flex; gap:24px; align-items:flex-start;\">\n      <div style=\"width:10px; height:10px; border-radius:50%; background: var(--atria-navy-900); margin-top:14px; flex:none;\"><\/div>\n      <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.4;\">Si la arrendadora no autoriza la cesión, la consecuencia no es la adjudicación: es la <span style=\"color: var(--atria-navy-700); font-weight:600;\">restitución del bien<\/span> y la liquidación de las cuentas del contrato conforme a sus propias reglas.<\/div>\n    <\/div>\n    <div style=\"background:#fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding:32px 40px; margin-top:6px;\">\n      <div style=\"font-family: var(--font-body); font-size: var(--type-body); color: var(--fg-1); line-height:1.4;\">Si la liquidación del leasing arroja pasivo superior al valor del bien, <span style=\"color: var(--atria-red-500); font-weight:600;\">no hay nada adjudicable<\/span>, en analogía con la imposibilidad de remate.<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer-row\">\n    <div style=\"font-family: var(--font-body); font-size: var(--type-micro); color: var(--fg-3);\"><\/div>\n  <\/div>\n<\/section>\n\n<section data-label=\"Conclusiones\" data-screen-label=\"20\" style=\"position:relative; width:100%; height:100%; background: var(--grad-radial-navy); color:#fff; padding: 64px var(--pad-x) 56px; display:flex; flex-direction:column; overflow:hidden;\"><div style=\"position:absolute; top:76px; right:var(--pad-x); font-family:var(--font-display); font-size:var(--type-micro); color:rgba(255,255,255,0.75); text-transform:uppercase; letter-spacing:0.08em; z-index:2; pointer-events:none;\">@majoinsolvencia<\/div>\n  <div style=\"position:absolute; inset:0;\"><img src=\"img-15-el-leasing-en-la-adjudicacion-patrimonia-fondo.jpg\" alt=\"\" style=\"width:100%; height:100%; object-fit:cover; opacity:0.4;\"><div style=\"position:absolute; inset:0; background: linear-gradient(180deg, rgba(0,49,115,0.4) 0%, rgba(0,26,63,0.8) 100%);\"><\/div><\/div>\n  <div style=\"position:absolute; inset:48px; border:1.5px solid rgba(255,255,255,0.18); border-radius:28px; pointer-events:none;\"><\/div>\n  <div class=\"eyebrow\" style=\"position:relative; font-size: var(--type-small); color: var(--atria-gold-300, #D2B181);\">Conclusiones<\/div>\n  <h2 style=\"position:relative; font-family: var(--font-display); text-transform:uppercase; font-weight:700; font-size: 50px; margin: 16px 0 30px;\">Cinco reglas prácticas<\/h2>\n  <div style=\"position:relative; display:grid; grid-template-columns: repeat(5, 1fr); gap:20px; flex:1;\">\n    <div style=\"background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius: var(--radius-md); padding:26px 22px; display:flex; flex-direction:column;\">\n      <div style=\"font-family: var(--font-display); font-weight:700; font-size:40px; color: var(--atria-gold-300, #D2B181);\">1<\/div>\n      <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size:24px; margin-top:12px; color:#fff;\">Doble capacidad de pago<\/div>\n      <div style=\"font-family: var(--font-body); font-size:24px; color: rgba(255,255,255,0.72); margin-top:10px; line-height:1.35;\">Verificar que el cliente pueda pagar el canon y, en paralelo, el resto de sus obligaciones.<\/div>\n    <\/div>\n    <div style=\"background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius: var(--radius-md); padding:26px 22px; display:flex; flex-direction:column;\">\n      <div style=\"font-family: var(--font-display); font-weight:700; font-size:40px; color: var(--atria-gold-300, #D2B181);\">2<\/div>\n      <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size:24px; margin-top:12px; color:#fff;\">Blindaje frente al cross default<\/div>\n      <div style=\"font-family: var(--font-body); font-size:24px; color: rgba(255,255,255,0.72); margin-top:10px; line-height:1.35;\">Revisar toda la relación del cliente con la entidad de leasing antes de negociar.<\/div>\n    <\/div>\n    <div style=\"background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius: var(--radius-md); padding:26px 22px; display:flex; flex-direction:column;\">\n      <div style=\"font-family: var(--font-display); font-weight:700; font-size:40px; color: var(--atria-gold-300, #D2B181);\">3<\/div>\n      <div style=\"font-family: var(--font-display); text-transform:uppercase; font-weight:600; font-size:24px; margin-top:12px; color:#fff;\">Terminar a tiempo<\/div>\n      <div style=\"font-family: var(--font-body); font-size:24px; color: rgba(255,255,255,0.72); margin-top:10px; line-height:1.35;\">Buscar la terminación unilateral desde la negociación para no acumular pasivo evitable.<\/div>\n    <\/div>\n    <div style=\"background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius: var(--radius-md); padding:26px 22px; display:flex; flex-direction:column;\">\n      <div style=\"font-family: var(--font-display); font-weight:700; font-size:40px; color: var(--atria-gold-300, #D2B181);\">4<\/div>\n      <div style=\"font-family: var(
