    '  background: var(--aa-steel-500); padding: 3px 8px; border-radius: 4px; margin-bottom: 8px;',
    '}',
    '.aa-result .aa-source-link {',
    '  display: inline-flex; align-items: center; gap: 6px; margin-top: 12px;',
    '  color: var(--aa-steel-700); font-weight: 600; font-family: var(--aa-font-body);',
    '  font-size: 13px; text-decoration: none;',
    '}',
    '.aa-result .aa-source-link:hover { color: var(--aa-navy-700); text-decoration: underline; }',
    '.aa-empty {',
    '  background: #fff; border-radius: 12px; padding: 24px 22px; text-align: center;',
    '  color: var(--aa-steel-700); font-size: 15px; line-height: 1.5; border: 1.5px dashed var(--aa-steel-300);',
    '}',
    '.aa-empty strong { display: block; color: var(--aa-navy-900); font-family: var(--aa-font-display); text-transform: uppercase; margin-bottom: 6px; font-size: 15px; }',
    '.aa-hint { color: var(--aa-steel-500); font-size: 13px; padding: 4px 22px 12px; }'
  ].join("\n");

  var PANEL_HTML =
    '<div id="atria-assist-scrim"></div>' +
    '<button id="atria-assist-toggle" type="button" aria-label="Abrir buscador de la conferencia">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>' +
      'Buscar en la conferencia' +
    '</button>' +
    '<button id="atria-assist-fullscreen" type="button" aria-label="Pantalla completa">' +
      '<svg id="atria-fs-icon-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>' +
      '<svg id="atria-fs-icon-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M8 3v3a2 2 0 0 1-2 2H3"></path><path d="M21 8h-3a2 2 0 0 1-2-2V3"></path><path d="M3 16h3a2 2 0 0 1 2 2v3"></path><path d="M16 21v-3a2 2 0 0 1 2-2h3"></path></svg>' +
      '<span id="atria-fs-label">Pantalla completa</span>' +
    '</button>' +
    '<aside id="atria-assist-panel">' +
      '<div id="atria-assist-header">' +
        '<button id="atria-assist-close" type="button" aria-label="Cerrar">×</button>' +
        '<div class="aa-eyebrow">Atria Abogados</div>' +
        '<h2>Buscador de la conferencia</h2>' +
      '</div>' +
      '<div id="atria-assist-disclaimer">Esto es un buscador de coincidencias — no es un asesor legal ni un modelo de lenguaje generativo. Responde principalmente con el texto de la conferencia; los resultados marcados como "fuente externa" son contexto adicional de sitios oficiales, no palabras de la conferencia.</div>' +
      '<form id="atria-assist-form">' +
        '<input id="atria-assist-input" type="text" placeholder="Ej: ¿es embargable la opción de compra?" autocomplete="off">' +
        '<button id="atria-assist-submit" type="submit">Buscar</button>' +
      '</form>' +
      '<div class="aa-hint">Busca sobre las 19 secciones de la conferencia, más 3 de contexto complementario (marcadas como fuente externa).</div>' +
      '<div id="atria-assist-results"></div>' +
    '</aside>';

  var STOPWORDS = new Set([
    "de","la","que","el","en","y","a","los","se","del","las","un","por","con","no","una","su","para",
    "es","al","lo","como","mas","o","pero","sus","le","ya","este","si","porque","esta","entre","cuando",
    "muy","sin","sobre","tambien","me","hasta","hay","donde","quien","desde","todo","nos","durante",
    "todos","uno","les","ni","contra","otros","ese","eso","ante","ellos","e","esto","mi","antes",
    "algunos","unos","yo","otro","otras","otra","tanto","esa","estos","mucho","quienes",
    "nada","muchos","cual","poco","ella","estar","estas","algunas","algo","nosotros","mis","tu",
    "te","ti","tus","ellas","nosotras","vosotros","vosotras","os","mio","mia","mios","mias","tuyo",
    "tuya","tuyos","tuyas","suyo","suya","suyos","suyas","nuestro","nuestra","nuestros","nuestras",
    "vuestro","vuestra","vuestros","vuestras","esos","esas","ser","haber","tener","hacer","cada",
    "cuales","puede","pueden","podra","podria","debe","deben","sera","son","fue","han","ha","habia",
    "asi","dentro","cabe","sea","sean","cuyo","cuya"
  ]);

  function stripAccents(s) {
    return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }
  function normalize(s) {
    return stripAccents(String(s || "").toLowerCase());
  }
  // Lightweight Spanish suffix stripper (not a full linguistic stemmer) —
  // just enough to collide common morphological variants that appear in
  // this legal text: plurals, "-mente" adverbs, and the very productive
  // "-ar/-er/-ir" verb <-> "-ación/-ición/-sión/-ción" noun pattern
  // (terminar/terminación, renegociar/renegociación, restituir/restitución...).
  // Applied identically to query and document tokens, so it only needs to
  // be internally consistent, not linguistically perfect.
  var STEM_SUFFIXES = [
    "aciones", "iciones", "iendo", "mente", "ciones",
    "acion", "icion", "ando", "ados", "adas", "idos", "idas",
    "cion", "sion", "ado", "ada", "ido", "ida",
    "ar", "er", "ir", "es", "s"
  ];
  function stem(t) {
    if (t.length < 6 || !/^[a-z]+$/.test(t)) return t;
    for (var i = 0; i < STEM_SUFFIXES.length; i++) {
      var suf = STEM_SUFFIXES[i];
      if (t.length - suf.length >= 4 && t.slice(-suf.length) === suf) {
        return t.slice(0, -suf.length);
      }
    }
    return t;
  }

  function tokenize(text) {
    var norm = normalize(text);
    var raw = norm.match(/[a-z0-9]+/g) || [];
    var out = [];
    for (var i = 0; i < raw.length; i++) {
      var t = raw[i];
      if (t.length < 2) continue;
      if (t.length > 22) continue;
      if (/^[a-z]+$/.test(t) && STOPWORDS.has(t)) continue;
      out.push(stem(t));
    }
    return out;
  }

  // Domain synonym groups (stemmed forms) — expanded only on the QUERY side,
  // so a casual/colloquial word choice still finds sections written in the
  // document's formal legal register, without polluting the actual term
  // statistics computed from the document text itself.
  var SYNONYM_GROUPS = [
    ["leasing", "arrendamiento"],
    ["cuota", "canon", "mensualidad", "pagando", "pagos"],
    ["dueno", "propietario", "propiedad", "dominio"],
    ["embargo", "embarg", "embargable", "secuestro"],
    ["quiebra", "insolvencia"],
    ["pagar", "pago"],
    ["cancel", "termin"],
    ["deuda", "obligacion"],
    ["vivienda", "inmueble"],
    ["bien", "activo"],
    ["banco", "arrendador", "entidad"],
    ["comprar", "adquirir", "adquisicion"],
    ["contabiliza", "contabiliz", "contable"],
    ["impuesto", "tributario", "tributaria"],
    ["recuper", "restitu"],
    ["consejo", "regla", "recomend"],
    ["escond", "escondo", "oculta", "oculto", "ocult", "miento", "omit", "omision", "omitio", "dolo", "dolosa", "simulo", "simul"],
    ["adjudicarse", "adjudic", "tercero", "tercer"],
    ["termino", "termin", "cancel"],
    ["cross", "default", "incumplimiento", "incumplio", "incumpl"]
  ];
  var SYNONYMS = {};
  SYNONYM_GROUPS.forEach(function (group) {
    group.forEach(function (term) {
      SYNONYMS[term] = group.filter(function (t) { return t !== term; });
    });
  });
  function expandWithSynonyms(tokens) {
    var out = tokens.slice();
    tokens.forEach(function (t) {
      if (SYNONYMS[t]) SYNONYMS[t].forEach(function (s) { if (out.indexOf(s) === -1) out.push(s); });
    });
    return out;
  }

  var N = SECTIONS.length;
  var docTermFreq = [];
  var titleTokenSets = [];
  var df = {};

  SECTIONS.forEach(function (sec) {
    var tf = {};
    var titleTokens = tokenize(sec.title);
    titleTokens.forEach(function (t) { tf[t] = (tf[t] || 0) + 4; });
    tokenize(sec.text).forEach(function (t) { tf[t] = (tf[t] || 0) + 1; });
    docTermFreq.push(tf);
    titleTokenSets.push(new Set(titleTokens));
    Object.keys(tf).forEach(function (t) { df[t] = (df[t] || 0) + 1; });
  });

  // BM25 idf (Robertson-Sparck Jones, +1-smoothed so it never goes negative
  // for terms that appear in almost every section — this corpus is small
  // and every section shares a lot of vocabulary, e.g. "leasing" itself).
  function idf(term) {
    var d = df[term] || 0;
    return Math.log((N - d + 0.5) / (d + 0.5) + 1);
  }

  // Plain TF-IDF cosine similarity has a well-known failure mode for a
  // corpus like this one: a short, dense section (e.g. "¿Qué es el
  // leasing?", which necessarily repeats "leasing"/"arrendamiento" many
  // times to define them) gets an artificially small vector norm, so its
  // cosine score for those words alone outranks longer, more specific
  // sections almost any time a query merely contains the word "leasing" —
  // regardless of how well the rest of the query matches. BM25 fixes this
  // by normalizing against average document length instead of vector norm,
  // and by saturating (not linearly scaling) with term frequency via k1.
  var BM25_K1 = 1.5;
  var BM25_B = 0.75;

  var docLen = docTermFreq.map(function (tf) {
    var sum = 0;
    Object.keys(tf).forEach(function (t) { sum += tf[t]; });
    return sum;
  });
  var avgDocLen = docLen.reduce(function (a, b) { return a + b; }, 0) / (docLen.length || 1);

  function bm25TermScore(term, i) {
    var tf = docTermFreq[i][term];
    if (!tf) return 0;
    var denom = tf + BM25_K1 * (1 - BM25_B + BM25_B * (docLen[i] / avgDocLen));
    return idf(term) * (tf * (BM25_K1 + 1)) / denom;
  }

  // Title-word matches are a strong relevance signal on their own — e.g.
  // "¿Qué es el leasing?" is obviously the best answer to "qué es
  // leasing" even though BM25 alone may not rank it first when the query
  // has extra words. This bonus rewards "this section's title literally
  // names what you asked about", scaled by the same idf so ubiquitous
  // words don't dominate.
  var TITLE_BOOST = 0.6;

  // Some title words are generic/boilerplate for this entire corpus (every
  // section is about Colombian law, so "colombia" appearing in one title is
  // not a discriminating signal the way "leasing" or "cross default" is).
  // Words here are excluded from the title-boost bonus so an out-of-scope
  // query that merely mentions Colombia doesn't false-positive-match a
  // section just because that word happens to sit in its title.
  var TITLE_BOOST_EXCLUDE = new Set(["colombia", "general", "proceso", "externa", "fuente", "complementario"]);

  function search(query) {
    var rawTokens = Array.from(new Set(tokenize(query)));
    if (rawTokens.length === 0) return [];
    var qTokens = Array.from(new Set(expandWithSynonyms(rawTokens)));
    var scores = SECTIONS.map(function (sec, i) {
      var tf = docTermFreq[i];
      var score = 0;
      qTokens.forEach(function (t) { score += bm25TermScore(t, i); });
      var titleHits = qTokens.filter(function (t) { return titleTokenSets[i].has(t) && !TITLE_BOOST_EXCLUDE.has(t); });
      titleHits.forEach(function (t) { score += TITLE_BOOST * idf(t); });
      var matched = qTokens.filter(function (t) { return !!tf[t]; });
      return { section: sec, score: score, matched: matched };
    });
    scores.sort(function (a, b) { return b.score - a.score; });
    return scores;
  }

  function splitSentences(text) {
    var parts = text.match(/[^.!?]+[.!?]+(["»”])?/g);
    return parts && parts.length ? parts : [text];
  }

  function accentInsensitiveRegex(token) {
    var map = { a: "aá", e: "eé", i: "ií", o: "oó", u: "uúü", n: "nñ" };
    var pattern = token.split("").map(function (ch) {
      if (map[ch]) return "[" + map[ch] + "]";
      return ch.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }).join("");
    return new RegExp(pattern, "gi");
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function buildSnippet(text, matchedTokens) {
    var sentences = splitSentences(text);
    var regexes = matchedTokens.map(accentInsensitiveRegex);
    var best = 0, bestScore = -1;
    sentences.forEach(function (s, i) {
      var score = 0;
      regexes.forEach(function (re) { var m = s.match(re); if (m) score += m.length; });
      if (score > bestScore) { bestScore = score; best = i; }
    });
    var startIdx = best, endIdx = best;
    if (sentences[best + 1] && bestScore > 0) endIdx = best + 1;
    var snippet = sentences.slice(startIdx, endIdx + 1).join(" ").trim();
    if (snippet.length > 480) snippet = snippet.slice(0, 480).trim() + "…";
    var prefix = startIdx > 0 ? "… " : "";
    var suffix = endIdx < sentences.length - 1 ? " …" : "";

    var html = escapeHtml(snippet);
    regexes.forEach(function (re) {
      html = html.replace(re, function (m) { return "<mark>" + m + "</mark>"; });
    });
    return prefix + html + suffix;
  }

  function activeSlideIndex() {
    var sections = document.querySelectorAll("section[data-screen-label]");
    for (var i = 0; i < sections.length; i++) {
      if (getComputedStyle(sections[i]).opacity === "1") return i;
    }
    return 0;
  }

  function goToSlide(targetIndex) {
    var current = activeSlideIndex();
    var delta = targetIndex - current;
    if (delta === 0) return;
    var key = delta > 0 ? "ArrowRight" : "ArrowLeft";
    var steps = Math.abs(delta);
    var code = delta > 0 ? 39 : 37;
    var i = 0;
    function step() {
      if (i >= steps) return;
      window.dispatchEvent(new KeyboardEvent("keydown", { key: key, code: key, keyCode: code, which: code, bubbles: true, cancelable: true }));
      i++;
      setTimeout(step, 90);
    }
    step();
  }

  // Calibrated against the BM25 scale (not the old cosine scale): legitimate
  // single-concept matches like "qué es leasing" land around 3.4-3.7, while
  // genuinely out-of-scope queries (no real vocabulary overlap) score 0.
  // A handful of out-of-scope queries that happen to share one generic word
  // with a section title (e.g. mentioning "Colombia") can land in the 2.5-3.8
  // range too — there's no threshold that cleanly separates those from the
  // legitimate low end, so this favors recall (per explicit product
  // decision: answer anything plausibly related) over precision.
  var MIN_SCORE = 3.0;

  function search_and_render(root, query) {
    var results = root.querySelector("#atria-assist-results");
    var ranked = search(query);
    results.innerHTML = "";
    var top = ranked.filter(function (r) { return r.score >= MIN_SCORE && r.matched.length > 0; }).slice(0, 3);

    if (top.length === 0) {
      var empty = document.createElement("div");
      empty.className = "aa-empty";
      empty.innerHTML = "<strong>El documento no cubre esta pregunta</strong>Ninguna de las secciones de la conferencia (ni el contexto complementario) tiene relación clara con tu búsqueda. Prueba con otros términos, o consulta directamente con un abogado de Atria.";
      results.appendChild(empty);
      return;
    }

    top.forEach(function (r) {
      var isExternal = r.section.type === "external";
      var card = document.createElement("div");
      card.className = "aa-result" + (isExternal ? " aa-external" : "");
      var snippet = buildSnippet(r.section.text, r.matched);
      var badge = isExternal ? '<div class="aa-ext-badge">Fuente externa — no es parte de la conferencia</div>' : "";
      var catLine = isExternal
        ? escapeHtml(r.section.sourceLabel || "Fuente externa")
        : escapeHtml(r.section.category) + " · " + escapeHtml(r.section.num);
      var footer = isExternal
        ? '<a class="aa-source-link" href="' + escapeHtml(r.section.sourceUrl || "#") + '" target="_blank" rel="noopener noreferrer">Ver fuente original ↗</a>'
        : '<button type="button" class="aa-goto">Ir a esta sección en la wiki →</button>';
      card.innerHTML =
        badge +
        '<div class="aa-cat">' + catLine + '</div>' +
        '<div class="aa-title">' + escapeHtml(r.section.title) + '</div>' +
        '<div class="aa-snippet">' + snippet + '</div>' +
        footer;
      if (!isExternal) {
        card.querySelector(".aa-goto").addEventListener("click", function () {
          goToSlide(r.section.slideIndex);
        });
      }
      results.appendChild(card);
    });
  }

  function boot() {
    if (!document.getElementById("atria-assist-style")) {
      var styleEl = document.createElement("style");
      styleEl.id = "atria-assist-style";
      styleEl.textContent = STYLE_CSS;
      document.head.appendChild(styleEl);
    }

    var root = document.createElement("div");
    root.id = "atria-assist-root";
    root.innerHTML = PANEL_HTML;
    document.body.appendChild(root);

    var toggle = root.querySelector("#atria-assist-toggle");
    var closeBtn = root.querySelector("#atria-assist-close");
    var scrim = root.querySelector("#atria-assist-scrim");
    var form = root.querySelector("#atria-assist-form");
    var input = root.querySelector("#atria-assist-input");

    function openPanel() { root.classList.add("aa-open"); setTimeout(function () { input.focus(); }, 200); }
    function closePanel() { root.classList.remove("aa-open"); }

    toggle.addEventListener("click", function () {
      if (root.classList.contains("aa-open")) closePanel(); else openPanel();
    });
    closeBtn.addEventListener("click", closePanel);
    scrim.addEventListener("click", closePanel);

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var q = input.value.trim();
      if (!q) return;
      search_and_render(root, q);
    });

    // ---- Fullscreen toggle (bottom-left, subtle) ----
    var fsBtn = root.querySelector("#atria-assist-fullscreen");
    var fsIconEnter = root.querySelector("#atria-fs-icon-enter");
    var fsIconExit = root.querySelector("#atria-fs-icon-exit");
    var fsLabel = root.querySelector("#atria-fs-label");

    function fullscreenElement() {
      return document.fullscreenElement || document.webkitFullscreenElement ||
        document.msFullscreenElement || document.mozFullScreenElement || null;
    }
    function requestFullscreen(el) {
      var fn = el.requestFullscreen || el.webkitRequestFullscreen ||
        el.msRequestFullscreen || el.mozRequestFullScreen;
      if (fn) fn.call(el);
    }
    function exitFullscreen() {
      var fn = document.exitFullscreen || document.webkitExitFullscreen ||
        document.msExitFullscreen || document.mozCancelFullScreen;
      if (fn) fn.call(document);
    }
    function syncFsUI() {
      var isFs = !!fullscreenElement();
      fsIconEnter.style.display = isFs ? "none" : "";
      fsIconExit.style.display = isFs ? "" : "none";
      fsLabel.textContent = isFs ? "Salir de pantalla completa" : "Pantalla completa";
      fsBtn.setAttribute("aria-label", fsLabel.textContent);
    }
    fsBtn.addEventListener("click", function () {
      if (fullscreenElement()) exitFullscreen();
      else requestFullscreen(document.documentElement);
    });
    ["fullscreenchange", "webkitfullscreenchange", "MSFullscreenChange", "mozfullscreenchange"].forEach(function (evt) {
      document.addEventListener(evt, syncFsUI);
    });
    syncFsUI();

    window.__atriaAssistSearch = search; // exposed for QA/testing only
    window.__atriaAssistTokenize = tokenize; // exposed for QA/testing only
    window.__atriaAssistReady = true;
  }

  // Presenter deck: always run without the left thumbnail rail, full-bleed.
  // deck-stage supports this as a real attribute (see its own shadow CSS:
  // ":host([no-rail]) .rail { display: none }"), it re-fits the canvas
  // itself — this is not a visual hack.
  function ensureNoRail() {
    var ds = document.querySelector("deck-stage");
    if (ds && !ds.hasAttribute("no-rail")) ds.setAttribute("no-rail", "");
  }

  // The runtime that turns this bundle's compressed template into the
  // live page does it by calling
  //   document.documentElement.replaceWith(freshlyParsedHtml)
  // — confirmed by reading its own source — and, per the earlier live
  // trace, does this in *multiple* rounds (once per slide section, ~21
  // times for this deck) rather than a single swap. Each round discards
  // whatever DOM existed a moment before, including anything this script
  // appended in an earlier round. Timers/observers set up here do survive
  // replaceWith (verified directly: setTimeout/setInterval/rAF all kept
  // firing across a replaceWith in a throwaway test page) — so instead of
  // "wait once, then boot once", this keeps checking for the whole ~20s
  // startup window and silently re-mounts the panel every time it finds
  // it missing, until the deck has clearly finished settling.
  var ATTEMPT_MS = 20000;
  var deadline = Date.now() + ATTEMPT_MS;

  function ensurePanel() {
    try { ensureNoRail(); } catch (err) { /* keep watchdog alive regardless */ }
    try {
      if (!document.getElementById("dc-root")) return;
      if (document.getElementById("atria-assist-root")) return; // already present
      boot();
    } catch (err) { /* keep watchdog alive regardless */ }
  }

  function tick() {
    ensurePanel();
    if (Date.now() > deadline) return;
    setTimeout(tick, 200);
  }
  tick();

  // Cheap belt-and-suspenders: also re-check on the standard lifecycle
  // events and on any DOM mutation, in case the 20s window above ever
  // isn't enough on a slower machine.
  document.addEventListener("DOMContentLoaded", ensurePanel);
  window.addEventListener("load", ensurePanel);
  window.addEventListener("pageshow", ensurePanel);
  new MutationObserver(ensurePanel).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>

</body>
</html>
